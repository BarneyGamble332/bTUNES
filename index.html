/* ===== Downloads zum Offline-Hören ===== */
let pdl=store.get('pdl',{});                 // Folgen-Schlüssel -> {p:Pfad, sz:Größe, t:Zeit}
let dlAutoDel=store.get('dlautodel',true);
const dlProg=new Map();
const saveDl=()=>store.set('pdl',pdl);
const fmtSize=b=>b>=1e9?(b/1e9).toFixed(1).replace('.',',')+' GB':Math.round(b/1e6)+' MB';
const isDl=k=>!!pdl[k];
function dlBadge(k){
  if(dlProg.has(k)){const p=dlProg.get(k);return `<span class="dlb" data-dlk="${k}">⬇ ${p.total>0?Math.round(p.got/p.total*100)+' %':'…'}</span>`;}
  return pdl[k]?'<span class="dlb ok">✓ offline</span>':'';
}
async function dlStart(k,quiet){
  const e=eps.get(k);if(!e||pdl[k]||dlProg.has(k))return;
  dlProg.set(k,{got:0,total:0});pcRefreshViews();
  if(!quiet)toast('Download gestartet');
  try{
    let r;
    if(NATIVE)r=await Music.download({key:k,url:e.u});
    else{for(let i=1;i<=10;i++){await sleep(250);if(!dlProg.has(k))throw new Error('abgebrochen');dlProg.set(k,{got:i,total:10});dlUpd(k);}r={path:'/demo/'+k,size:42e6};}
    pdl[k]={p:r.path,sz:r.size,t:Date.now()};saveDl();
  }catch(err){if(!/abgebrochen/.test(String(err&&err.message||err)))toast('Download fehlgeschlagen');}
  dlProg.delete(k);pcRefreshViews();
}
function dlCancel(k){dlProg.delete(k);if(NATIVE)Music.cancelDownload({key:k}).catch(()=>{});pcRefreshViews();}
function dlDelete(k){if(!pdl[k])return;if(NATIVE)Music.deleteDownload({key:k}).catch(()=>{});delete pdl[k];saveDl();}
/* Fortschritt nur in den betroffenen Zeilen nachführen */
function dlUpd(k){document.querySelectorAll(`[data-dlk="${k}"]`).forEach(el=>{const p=dlProg.get(k);if(p)el.textContent='⬇ '+(p.total>0?Math.round(p.got/p.total*100)+' %':'…');});}
if(NATIVE)Music.addListener('dl',ev=>{if(!dlProg.has(ev.key))return;dlProg.set(ev.key,{got:ev.got,total:ev.total});dlUpd(ev.key);});
/* Gehörte Downloads aufräumen */
let dlCleanT=null;
function dlClean(){clearTimeout(dlCleanT);dlCleanT=setTimeout(()=>{if(!dlAutoDel)return;const cur=curEp();let n=0;
  for(const k of Object.keys(pdl))if(isDone(k)&&(!cur||cur.k!==k)){dlDelete(k);n++;}
  if(n)pcRefreshViews();},3000);}
/* Beim Start mit dem Speicher abgleichen */
async function dlSync(){if(!NATIVE)return;try{const r=await Music.listDownloads();const have=new Set((r.files||[]).map(f=>f.name));
  let ch=false;for(const k of Object.keys(pdl))if(!have.has(k)){delete pdl[k];ch=true;}
  for(const f of r.files||[])if(!pdl[f.name]&&eps.has(f.name)){pdl[f.name]={p:f.path,sz:f.size,t:Date.now()};ch=true;}
  if(ch){saveDl();pcRenderHome();}dlFree=r.free||0;}catch(e){}}
let dlFree=0;
/* Automatisch laden: neueste Folgen der markierten Podcasts, nur im WLAN */
function onWifi(){const c=navigator.connection;return !!(c&&(c.type==='wifi'||c.type==='ethernet'));}
function dlAuto(){
  if(!onWifi()&&NATIVE)return;
  for(const p of pods){if(!p.auto)continue;
    podEps(p.id).filter(e=>e.d>(p.autoSince||p.added||0)-7*864e5&&!isDone(e.k)).slice(0,2).forEach(e=>dlStart(e.k,true));}
}
function openDownloads(){
  openView('Downloads',(b,v)=>{
    const draw=()=>{
      const done=Object.keys(pdl).map(k=>eps.get(k)).filter(Boolean).sort((a,c)=>(pdl[c.k].t||0)-(pdl[a.k].t||0));
      const run=[...dlProg.keys()].map(k=>eps.get(k)).filter(Boolean);
      const size=Object.values(pdl).reduce((s,x)=>s+(x.sz||0),0);
      b.innerHTML=`<div class="s" style="color:var(--mute);margin:4px 2px 10px">${done.length} ${done.length===1?'Folge':'Folgen'} · ${fmtSize(size)} belegt${dlFree?' · '+fmtSize(dlFree)+' frei':''}</div>
        <div class="acts"><button data-go="auto" class="${dlAutoDel?'on':''}"><svg class="i"><use href="#${dlAutoDel?'i-check':'i-x'}"/></svg>Gehörte löschen</button>${done.length?'<button data-go="delall"><svg class="i"><use href="#i-trash"/></svg>Alle löschen</button>':''}</div>
        <div style="color:var(--mute);font-size:12.5px;margin:2px 2px 8px">${dlAutoDel?'Fertig gehörte Folgen werden automatisch vom Handy gelöscht.':'Downloads bleiben, bis du sie selbst löschst.'} Neue Folgen automatisch laden (im WLAN) stellst du je Podcast über ⋮ ein.</div>
        ${run.length?`<div class="sec">Wird geladen</div>${run.map(e=>epRow(e)).join('')}`:''}
        ${done.length?`<div class="sec">Auf dem Handy</div>${done.map(e=>epRow(e)).join('')}`:'<div class="hint">Noch nichts heruntergeladen.<br>Über ⋮ bei einer Folge → „Herunterladen“.</div>'}`;};
    v._draw=draw;draw();
    b.onclick=e=>{const g=e.target.closest('[data-go]');
      if(g){if(g.dataset.go==='auto'){dlAutoDel=!dlAutoDel;store.set('dlautodel',dlAutoDel);dlClean();draw();}
        else if(g.dataset.go==='delall'&&confirm('Alle Downloads vom Handy löschen?')){Object.keys(pdl).forEach(dlDelete);pcRefreshViews();}return;}
      epClick(e,'dl');};
  });
}
/* Startseite Podcasts */
function pcRenderHome(){
  const B=$('#pcBody');if(!B)return;
  const q=norm($('#pcQ').value.trim());
  if(!pods.length&&!q){B.innerHTML=`<div class="hint" style="padding-top:50px"><svg class="i" style="width:54px;height:54px;color:var(--acc)"><use href="#i-mic"/></svg><br><br><b style="color:var(--txt);font-size:17px">Noch keine Podcasts</b><br>Suche im Verzeichnis, füge eine RSS-Adresse ein oder importiere deine Abos aus einer anderen App (OPML).</div>
    <div class="acts"><button class="pri" data-go="add"><svg class="i"><use href="#i-search"/></svg>Podcast finden</button></div>`;return;}
  let h='';
  if(q){
    const ps=pods.filter(p=>norm(p.title+' '+p.author).includes(q));
    const es=[...eps.values()].filter(e=>podById.has(e.pid)&&norm(e.t+' '+e.x).includes(q)).sort((a,b)=>b.d-a.d).slice(0,60);
    if(ps.length)h+=`<div class="sec">Podcasts</div><div class="pgrid">${ps.map(podCard).join('')}</div>`;
    if(es.length)h+=`<div class="sec">Folgen</div>${es.map(e=>epRow(e)).join('')}`;
    h+=`<div class="acts"><button data-go="dir"><svg class="i"><use href="#i-search"/></svg>„${esc($('#pcQ').value.trim())}“ im Verzeichnis suchen</button></div>`;
    B.innerHTML=h;return;
  }
  const all=[...eps.values()].filter(e=>podById.has(e.pid));
  const cont=all.filter(e=>{const s=stOf(e.k);return !s.x&&s.p>30000;}).sort((a,b)=>stOf(b.k).t-stOf(a.k).t).slice(0,10);
  if(cont.length)h+=`<div class="sec">Weiterhören</div><div class="hscroll">${cont.map(e=>{const s=stOf(e.k),p=podById.get(e.pid)||{},d=s.d||e.s*1000;return `<button class="ccard" data-play="${e.k}"><div class="cv" style="background-image:url('${esc(e.i||p.art||'')}')"><div class="pl"><svg class="i" style="width:16px;height:16px;fill:#fff;stroke:none"><use href="#i-play"/></svg></div>${d?`<div class="pb"><i style="width:${Math.min(100,s.p/d*100)}%"></i></div>`:''}</div><div class="n">${esc(e.t)}</div><div class="s">${d?'noch '+fmtMin((d-s.p)/1000):''}</div></button>`;}).join('')}</div>`;
  const ll=plist.filter(k=>eps.has(k));
  h+=`<div class="sec secrow"><span>Meine Liste</span><button class="lnk" data-go="list">${ll.length?ll.length+' Folgen ›':'Zusammenstellen ›'}</button></div>`;
  if(ll.length)h+=ll.slice(0,3).map(k=>epRow(eps.get(k))).join('');
  else h+=`<div style="color:var(--mute);font-size:13.5px;padding:0 2px 4px">Reihe Folgen über ⋮ ein und stell dir dein eigenes Programm zusammen.</div>`;
  const dk=Object.keys(pdl).filter(k=>eps.has(k));
  if(dk.length||dlProg.size)h+=`<div class="sec secrow"><span>Downloads</span><button class="lnk" data-go="dls">${dk.length} offline${dlProg.size?' · '+dlProg.size+' laden':''} · ${fmtSize(dk.reduce((s,k)=>s+(pdl[k].sz||0),0))} ›</button></div>`;
  const fresh=all.filter(e=>{const p=podById.get(e.pid);return !isDone(e.k)&&e.d>(p.added||0)-14*864e5;}).sort((a,b)=>b.d-a.d).slice(0,8);
  if(fresh.length)h+=`<div class="sec secrow"><span>Neue Folgen</span><button class="lnk" data-go="refresh">Aktualisieren ↻</button></div>${fresh.map(e=>epRow(e)).join('')}`;
  const cats=['Alle',...pcats.filter(c=>pods.some(p=>p.cat===c))];
  if(!cats.includes(pcCat))pcCat='Alle';
  let ps=pods.filter(p=>pcCat==='Alle'||p.cat===pcCat);
  const latest=p=>{const l=podEps(p.id);return l.length?l[0].d:0;};
  ps.sort(pcSort==='az'?(a,b)=>a.title.localeCompare(b.title,'de'):(a,b)=>latest(b)-latest(a));
  h+=`<div class="sec secrow"><span>Meine Podcasts</span><button class="lnk" data-go="psort">${pcSort==='az'?'A–Z':'Neueste Folge'} ⇅</button></div>
    ${cats.length>1||pods.length>3?`<div class="chips">${cats.map(c=>`<button data-cat="${esc(c)}" class="${c===pcCat?'on':''}">${c==='Alle'?'Alle':'📁 '+esc(c)}</button>`).join('')}<button data-go="newcat">＋ Ordner</button></div>`:''}
    <div class="pgrid">${ps.map(podCard).join('')}</div>`;
  B.innerHTML=h;
}
function podCard(p){
  const n=podEps(p.id).filter(e=>!isDone(e.k)&&!(stOf(e.k).p>0)&&e.d>(p.added||0)).length;
  return `<button class="pc" data-pod="${p.id}"><div class="cv" style="background-image:url('${esc(p.art||'')}')">${p.art?'':esc(p.title)}</div>${n?`<div class="badge">${n>99?'99+':n}</div>`:''}<div class="n">${esc(p.title)}</div></button>`;
}
$('#pcBody').onclick=e=>{
  const g=e.target.closest('[data-go]');
  if(g){const a=g.dataset.go;
    if(a==='add')openAdd();else if(a==='list')openList();else if(a==='dls')openDownloads();else if(a==='refresh')refreshAll(true);
    else if(a==='dir')openAdd($('#pcQ').value.trim());
    else if(a==='psort'){pcSort=pcSort==='az'?'neu':'az';store.set('psort',pcSort);pcRenderHome();}
    else if(a==='newcat'){const n=prompt('Neuer Ordner (z. B. Wissen, Comedy, Sport)');if(n&&n.trim()&&!pcats.includes(n.trim())){pcats.push(n.trim());store.set('pcats',pcats);toast('Ordner angelegt – Podcasts über ⋮ auf der Podcast-Seite einsortieren');}}
    return;}
  const c=e.target.closest('[data-cat]');if(c){pcCat=c.dataset.cat;store.set('pcat',pcCat);pcRenderHome();return;}
  const p=e.target.closest('[data-pod]');if(p){openPodcast(p.dataset.pod);return;}
  epClick(e,'home');
};
$('#pcQ').oninput=()=>pcRenderHome();
$('#pcAddBtn').onclick=()=>openAdd();
$('#pcListBtn').onclick=()=>openList();

/* Mini-Player und großer Podcast-Player */
function pcMini(){
  const e=curEp(),m=$('#pcMini');
  m.classList.toggle('hidden',!e);
  if(!e)return;const p=podById.get(e.pid)||{};
  $('#pcMiniArt').style.backgroundImage=`url("${e.i||p.art||''}")`;
  $('#pcMiniT').textContent=e.t;$('#pcMiniA').textContent=p.title||'';
  $('#pcMiniIco').setAttribute('href',S.playing?'#i-pause':'#i-play');
  let pos=S.pos||0;if(S.playing)pos+=Date.now()-lastPosAt;const d=S.dur||e.s*1000;
  $('#pcMiniPr').style.width=(d?Math.min(100,pos/d*100):0)+'%';
}
const skip=ms=>{let pos=S.pos||0;if(S.playing)pos+=Date.now()-lastPosAt;ctl('seek',{ms:Math.max(0,pos+ms)});};
$('#pcMiniPlay').onclick=()=>ctl('toggle');
$('#pcMiniBack').onclick=()=>skip(-15000);
$('#pcMiniFwd').onclick=()=>skip(30000);
$('#pcMiniTx').onclick=()=>openPlayer();
$('#pcMiniArt').onclick=()=>openPlayer();
let sleepT=null,sleepEnd=0,sleepEp=false;
function setSleep(min){clearTimeout(sleepT);sleepT=null;sleepEnd=0;sleepEp=false;
  if(min===-1){sleepEp=true;toast('Stoppt am Ende der Folge');}
  else if(min>0){sleepEnd=Date.now()+min*6e4;sleepT=setTimeout(()=>{ctl('pause');sleepEnd=0;},min*6e4);toast('Schlaf-Timer: '+min+' Min.');}
  else toast('Schlaf-Timer aus');pcRefreshViews();}
function openPlayer(){
  const e0=curEp();if(!e0)return;
  openView('Läuft gerade',(b,v)=>{
    b.innerHTML=`<div class="pplayer"><div class="big" id="ppArt"></div><h2 id="ppT"></h2><div class="s" id="ppA"></div>
      <div class="prog"><span id="ppPos">0:00</span><input type="range" id="ppSeek" min="0" max="1000" value="0"><span id="ppDur">0:00</span></div>
      <div class="ctl"><button class="ibtn skip" data-go="b15"><svg class="i" style="width:34px;height:34px"><use href="#i-rew"/></svg><b>15</b></button>
        <button class="play" data-go="tog"><svg class="i"><use href="#i-play" id="ppIco"/></svg></button>
        <button class="ibtn skip" data-go="f30"><svg class="i" style="width:34px;height:34px"><use href="#i-fwd"/></svg><b>30</b></button></div>
      <div class="pextra"><button data-go="speed" id="ppSpeed"></button><button data-go="sleep" id="ppSleep"><svg class="i" style="width:18px"><use href="#i-moon"/></svg><span></span></button>
        <button data-go="next"><svg class="i" style="width:18px"><use href="#i-next"/></svg>Nächste</button><button data-go="info"><svg class="i" style="width:18px"><use href="#i-news"/></svg>Infos</button></div></div>`;
    const sk=b.querySelector('#ppSeek');let drag=false;
    const draw=()=>{const e=curEp();if(!e){return;}const p=podById.get(e.pid)||{};
      b.querySelector('#ppArt').style.backgroundImage=`url("${e.i||p.art||''}")`;
      b.querySelector('#ppT').textContent=e.t;b.querySelector('#ppA').textContent=p.title||'';
      b.querySelector('#ppIco').setAttribute('href',S.playing?'#i-pause':'#i-play');
      let pos=S.pos||0;if(S.playing)pos+=Date.now()-lastPosAt;const d=S.dur||e.s*1000;
      if(!drag){sk.value=d?Math.round(pos/d*1000):0;sk.style.setProperty('--p',(d?pos/d*100:0)+'%');}
      b.querySelector('#ppPos').textContent=fmt(drag?sk.value/1000*d:pos);b.querySelector('#ppDur').textContent='-'+fmt(Math.max(0,d-pos)/pcSpeed);
      b.querySelector('#ppSpeed').textContent=String(pcSpeed).replace('.',',')+'×';
      const sl=b.querySelector('#ppSleep');sl.classList.toggle('on',!!(sleepEnd||sleepEp));
      sl.querySelector('span').textContent=sleepEp?'Folgenende':sleepEnd?Math.ceil((sleepEnd-Date.now())/6e4)+' Min.':'Schlaf-Timer';};
    v._draw=draw;draw();const iv=setInterval(()=>{if(!document.body.contains(v)){clearInterval(iv);return;}draw();},1000);
    sk.oninput=()=>{drag=true;sk.style.setProperty('--p',sk.value/10+'%');draw();};
    sk.onchange=()=>{const e=curEp();const d=S.dur||(e?e.s*1000:0);ctl('seek',{ms:Math.round(sk.value/1000*d)});drag=false;};
    b.onclick=ev=>{const g=ev.target.closest('[data-go]');if(!g)return;const a=g.dataset.go;
      if(a==='tog')ctl('toggle');else if(a==='b15')skip(-15000);else if(a==='f30')skip(30000);
      else if(a==='next'){const e=curEp();if(e){pst[e.k]={x:true,t:Date.now()};savePst();plist=plist.filter(x=>x!==e.k);store.set('plist',plist);}ctl('next');}
      else if(a==='info'){const e=curEp();if(e)openEpisode(e.k);}
      else if(a==='speed'){const sp=[0.8,1,1.2,1.4,1.6,1.8,2];pcSpeed=sp[(sp.indexOf(pcSpeed)+1)%sp.length];store.set('pspeed',pcSpeed);ctl('speed',{speed:pcSpeed});draw();}
      else if(a==='sleep')menu('Schlaf-Timer',[['i-moon','15 Minuten',()=>setSleep(15)],['i-moon','30 Minuten',()=>setSleep(30)],['i-moon','45 Minuten',()=>setSleep(45)],['i-moon','60 Minuten',()=>setSleep(60)],['i-moon','Am Ende der Folge',()=>setSleep(-1)],['i-x','Aus',()=>setSleep(0)]]);};
  });
}
/* Offene Podcast-Ansichten neu zeichnen */
function pcRefreshViews(){document.querySelectorAll('.view').forEach(v=>{if(v._draw)v._draw();});pcRenderHome();}
let pcLastKey='',pcLastPlaying=null;
window.pcRender=function(){
  const e=curEp();
  if(e){pcTrack();
    if(sleepEp&&lastEpKey&&e.k!==pcSleepKey&&pcSleepKey){sleepEp=false;ctl('pause');}
    pcSleepKey=e.k;}
  pcMini();
  const key=(e?e.k:'')+'|'+S.playing;
  if(key!==pcLastKey){pcLastKey=key;
    document.querySelectorAll('.ep').forEach(r=>{const k=r.dataset.ep,cur=e&&k===e.k;r.classList.toggle('cur',!!cur);const u=r.querySelector('.pp use');if(u)u.setAttribute('href',cur&&S.playing?'#i-pause':'#i-play');});
    document.querySelectorAll('.view').forEach(v=>{if(v._draw&&!v.querySelector('#ppSeek'))v._draw();});
  }
};
let pcSleepKey='';

/* Reiter umschalten */
let curTab=store.get('tab2','music');
function setTab(t){curTab=t;store.set('tab2',t);
  $('#main').classList.toggle('hidden',t!=='music');$('#pod').classList.toggle('hidden',t!=='pod');
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  if(t==='pod'){pcRenderHome();pcMini();refreshAll(false);}}
document.querySelectorAll('.seg').forEach(s=>s.onclick=e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab);});
setTab(curTab);
dlSync();
setInterval(()=>refreshAll(false),30*6e4);

/* Vorführmodus im Browser */
function demoFeed(u){
  const names={a:['Bergfunk','Gespräche über Gipfel, Touren und Hütten','Radio Werdenfels Demo'],b:['Zeitreise','Geschichte in 30 Minuten','Demo-Verlag'],c:['Technik am Abend','Gadgets, Apps und Kurioses','Studio Demo']};
  const k=(u.match(/demo-(\w)/)||[0,'a'])[1],n=names[k]||names.a;
  const col={a:'#3a6ea5',b:'#a5553a',c:'#5a3aa5'}[k]||'#555';
  const art='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="${col}"/><circle cx="220" cy="80" r="50" fill="#fff3"/><text x="20" y="250" font-family="sans-serif" font-size="38" font-weight="800" fill="#fff">${n[0]}</text></svg>`);
  let items='';const now=Date.now();
  for(let i=0;i<14;i++)items+=`<item><title>${n[0]} #${60-i}: ${['Der lange Weg','Hüttenzauber','Gewitter am Grat','Was wir lernten','Die große Frage','Unterwegs'][i%6]}</title><guid>${k}${i}</guid><pubDate>${new Date(now-i*4*864e5-36e5).toUTCString()}</pubDate><itunes:duration>${1800+i*137}</itunes:duration><enclosure url="https://example.org/${k}${i}.mp3" type="audio/mpeg"/><description>&lt;p&gt;In dieser Folge sprechen wir über ${n[1].toLowerCase()}.&lt;/p&gt;&lt;p&gt;Viel Spaß beim Hören!&lt;/p&gt;</description></item>`;
  return `<?xml version="1.0"?><rss xmlns:itunes="http://www.itunes.com/dtds/podcast-1.0.dtd"><channel><title>${n[0]}</title><itunes:author>${n[2]}</itunes:author><itunes:image href="${art.replace(/"/g,'&quot;')}"/><description>${n[1]}</description>${items}</channel></rss>`;
}
function demoItunes(){return Promise.resolve({results:[['Bergfunk','Radio Werdenfels Demo','a','Freizeit'],['Zeitreise','Demo-Verlag','b','Geschichte'],['Technik am Abend','Studio Demo','c','Technologie']].map(x=>({collectionName:x[0],artistName:x[1],feedUrl:'https://demo-'+x[2]+'.example/feed',artworkUrl600:'',primaryGenreName:x[3]}))});}

/* ===== Start ===== */
async function loadLibrary(manual){
  try{
    const r=await Music.scan();buildLibrary(r.tracks||[]);
    if(manual)toast(tracks.length+' Titel gefunden');
  }catch(e){toast(String(e&&e.message||e));}
  renderLib();render();
}
async function start(){
  Music.addListener('state',onState);
  let ok=false;try{ok=(await Music.status()).granted;}catch(e){}
  if(!ok){$('#welcome').classList.remove('hidden');$('#pick').classList.add('hidden');
    $('#btnGrant').onclick=async()=>{let g=false;try{g=(await Music.request()).granted;}catch(e){}
      if(g){$('#welcome').classList.add('hidden');$('#pick').classList.remove('hidden');await loadLibrary();}else toast('Ohne Freigabe findet die App keine Musik');};
    render();return;}
  await loadLibrary();
  try{const s=await Music.getState({queue:true});
    if(s.queue&&s.queue.length){queue=s.queue.map(Number);store.set('queue',queue);}
    onState(s);}catch(e){}
}
start();
