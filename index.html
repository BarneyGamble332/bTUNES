<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14110f">
<title>bTUNES</title>
<style>
:root{
  --bg:#14110f; --bg2:#1d1916; --card:#25201c; --line:#3a332d;
  --txt:#f3ece4; --mute:#a59a8e; --acc:#e8a547; --acc2:#c9762e;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---------- Plattenspieler ---------- */
#main{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 14px);
  background:radial-gradient(120% 70% at 50% 20%,#2a221c 0%,var(--bg) 70%)}
.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.top h1{font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:0}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--txt)}
.ibtn:active{background:#ffffff14}

.deckwrap{flex:none;display:flex;justify-content:center;margin:6px 0 4px}
.deck{position:relative;width:min(100%,50vh,520px);aspect-ratio:100/92;border-radius:5.5%/6%;
  background:
    linear-gradient(180deg,#ffffff10,#0000 30%,#00000040),
    repeating-linear-gradient(97deg,#0000 0 3px,#00000018 3px 4px,#0000 4px 9px,#ffffff08 9px 10px),
    linear-gradient(135deg,#6b4428,#4a2d19 45%,#3b2312);
  box-shadow:0 18px 40px #000a,inset 0 1px 0 #ffffff30,inset 0 -3px 6px #0006}
.deck::after{content:"";position:absolute;inset:2.2%;border-radius:4.5%/5%;
  background:linear-gradient(180deg,#232120,#171615);box-shadow:inset 0 2px 5px #000c,0 1px 0 #ffffff1a}
.platter{position:absolute;z-index:1;left:4%;top:10.87%;width:76%;aspect-ratio:1;border-radius:50%;
  background:conic-gradient(from 20deg,#9a9a9a,#e3e3e3,#8b8b8b,#d4d4d4,#7a7a7a,#e6e6e6,#9a9a9a);
  box-shadow:0 4px 10px #000c}
.platter::after{content:"";position:absolute;inset:2.5%;border-radius:50%;background:#111;
  box-shadow:inset 0 0 0 2px #000}
.platter .empty{position:absolute;inset:0;z-index:1;display:grid;place-items:center;text-align:center;
  color:#777;font-size:13px;padding:22%}
.record{position:absolute;z-index:2;left:5.5%;top:12.5%;width:73%;aspect-ratio:1;border-radius:50%;
  transition:transform .7s cubic-bezier(.3,.7,.2,1),opacity .5s}
.record.off{transform:translate(70%,-12%) scale(.9);opacity:0}
.record.leave{transform:translate(-80%,8%) scale(.9) ;opacity:0}
.disc{position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle,#0000 0 29.5%,#000 29.5% 30.5%,#0000 30.5%),
    repeating-radial-gradient(circle,#161616 0 1px,#0c0c0c 1px 2.2px,#1b1b1b 2.2px 3px),
    #0d0d0d;
  box-shadow:0 0 0 1px #000,0 6px 14px #000d;
  animation:spin 1.8s linear infinite;animation-play-state:paused}
.playing .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.disc .lbl{position:absolute;left:21%;top:21%;width:58%;height:58%;border-radius:50%;overflow:hidden;
  background:#3b3b3b center/cover no-repeat;box-shadow:0 0 0 2px #0008}
.disc .lbl::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,#0000 0 60%,#0003 100%)}
.disc .lbl .txt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14%;
  font-weight:700;font-size:clamp(10px,3.4vw,16px);color:#fff;text-shadow:0 1px 3px #000}
.disc .hole{position:absolute;left:48.6%;top:48.6%;width:2.8%;height:2.8%;border-radius:50%;
  background:radial-gradient(#ddd,#888);box-shadow:0 0 0 1.5px #0009}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 300deg,#0000 0deg,#ffffff16 20deg,#0000 45deg,#0000 180deg,#ffffff10 205deg,#0000 230deg);
  mask:radial-gradient(circle,#0000 0 29%,#000 30%);-webkit-mask:radial-gradient(circle,#0000 0 29%,#000 30%)}
.arm{position:absolute;inset:0;z-index:3;width:100%;height:100%;pointer-events:none;overflow:visible}
.arm .swing{transform-box:view-box;transform-origin:88px 14px;transition:transform 1s cubic-bezier(.4,.1,.2,1)}
.knob{position:absolute;z-index:3;width:9%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#eee,#888 60%,#555);box-shadow:0 2px 4px #000c}
.led{position:absolute;z-index:3;left:94%;top:82.5%;width:2.2%;aspect-ratio:1;border-radius:50%;background:#4a1d10;
  transition:background .4s,box-shadow .4s}
.playing .led{background:#ff5a2a;box-shadow:0 0 8px #ff5a2a}
.rpm{position:absolute;z-index:3;left:83.5%;top:90.5%;font-size:min(2.4vw,11px);color:#8a8076;letter-spacing:.08em;font-weight:700}

.info{text-align:center;margin-top:12px;min-height:50px}
.info .t{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .a{color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.prog input{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--acc) var(--p,0%),#4a423b var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--txt);margin-top:-6px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 0}
.ctl .ibtn.on{color:var(--acc)}
.ctl .ibtn{position:relative}
.ctl .one{position:absolute;font-size:9px;font-weight:800;top:9px;right:8px}
.play{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,#f2b65d,var(--acc2));color:#1a120b;box-shadow:0 6px 16px #c9762e55}
.play svg.i{width:32px;height:32px;fill:currentColor;stroke:none}
.play:active{transform:scale(.96)}
.pick{margin-top:auto;display:flex;gap:10px}
.pick button{flex:1;height:50px;border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.pick button:active{background:#302922}

/* ---------- Bibliothek ---------- */
.sheet{position:absolute;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.3,.7,.2,1)}
.sheet.open{transform:none}
.shead{padding:calc(var(--safe-t) + 8px) 8px 0;background:var(--bg)}
.srow{display:flex;align-items:center;gap:4px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;height:42px;color:var(--mute)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%;color:var(--txt)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 8px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:7px 14px;border-radius:20px;background:var(--card);color:var(--mute);font-weight:600;font-size:14px}
.tabs button.on{background:var(--txt);color:var(--bg)}
.sbody{flex:1;overflow-y:auto;padding:0 12px calc(var(--safe-b) + 90px);-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px 12px}
.alb{text-align:left;min-width:0}
.alb .cv{aspect-ratio:1;border-radius:8px;background:#2c2621 center/cover no-repeat;box-shadow:0 4px 10px #0007;position:relative;overflow:hidden}
.alb .cv .ph{position:absolute;inset:0;display:grid;place-items:center;color:#5d544b}
.alb .n{font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb .s{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .row{display:flex;align-items:center;gap:12px;padding:8px 2px;min-height:56px;border-bottom:1px solid #2a241f;width:100%;text-align:left}
.row .th{width:46px;height:46px;border-radius:6px;background:#2c2621 center/cover no-repeat;flex:none;display:grid;place-items:center;color:#6d6359}
.row .th.round{border-radius:50%}
.row .nr{width:26px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums;flex:none;font-size:13px}
.row .tx{flex:1;min-width:0}
.row .tx .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx .s{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.row .more{width:38px;height:38px;display:grid;place-items:center;color:var(--mute);border-radius:50%}
.row.cur .n{color:var(--acc);font-weight:600}
.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:18px 2px 8px;font-weight:700}
.hint{color:var(--mute);text-align:center;padding:40px 20px}

/* Detailansicht (Album, Interpret, Ordner, Playlist) */
.view{position:absolute;inset:0;z-index:12;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.view.open{transform:none}
.vhead{display:flex;align-items:center;gap:4px;padding:calc(var(--safe-t) + 8px) 8px 4px}
.vhead .tt{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbody{flex:1;overflow-y:auto;padding:0 14px calc(var(--safe-b) + 90px)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 10px}
.hero .big{width:min(62vw,280px);aspect-ratio:1;border-radius:10px;background:#2c2621 center/cover no-repeat;box-shadow:0 12px 30px #000a}
.hero h2{margin:14px 0 2px;font-size:21px}
.hero .s{color:var(--mute)}
.acts{display:flex;gap:10px;margin:14px 0 6px}
.acts button{flex:1;height:46px;border-radius:12px;background:var(--card);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.acts button.pri{background:linear-gradient(180deg,#f2b65d,var(--acc2));color:#1a120b}

/* Mini-Player unten in der Bibliothek */
.mini{position:absolute;z-index:20;left:10px;right:10px;bottom:calc(var(--safe-b) + 10px);height:62px;border-radius:14px;
  background:#2b2520ee;backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:0 8px 0 8px;
  box-shadow:0 8px 20px #0009;transform:translateY(140%);transition:transform .3s}
.mini.show{transform:none}
.mini .mr{width:46px;height:46px;border-radius:50%;flex:none;position:relative;
  background:repeating-radial-gradient(circle,#161616 0 1px,#0c0c0c 1px 2px);animation:spin 1.8s linear infinite;animation-play-state:paused}
.mini.playing .mr{animation-play-state:running}
.mini .mr i{position:absolute;inset:24%;border-radius:50%;background:#444 center/cover}
.mini .tx{flex:1;min-width:0}
.mini .tx .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tx .s{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Auswahlmenü */
.dim{position:absolute;inset:0;z-index:40;background:#0009;opacity:0;pointer-events:none;transition:opacity .2s}
.dim.show{opacity:1;pointer-events:auto}
.menu{position:absolute;z-index:41;left:0;right:0;bottom:0;background:#26201b;border-radius:18px 18px 0 0;
  padding:8px 0 calc(var(--safe-b) + 10px);transform:translateY(105%);transition:transform .25s;max-height:75vh;overflow-y:auto}
.menu.show{transform:none}
.menu .mt{padding:10px 20px 8px;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 20px;text-align:left}
.menu button:active{background:#ffffff0d}
.menu button.del{color:#ff7b6b}
.toast{position:absolute;z-index:60;left:50%;bottom:calc(var(--safe-b) + 86px);transform:translateX(-50%) translateY(20px);
  background:#f3ece4;color:#14110f;padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
/* Band-Infos */
.ncard{margin-top:14px;background:linear-gradient(135deg,#2c241d,#221c17);border:1px solid #3a3029;border-radius:14px;padding:10px 12px 4px;animation:nin .5s ease}
@keyframes nin{from{opacity:0;transform:translateY(8px)}}
.ncard .nh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.ncard .nh .lv{width:7px;height:7px;border-radius:50%;background:#ff5a2a;box-shadow:0 0 6px #ff5a2a;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.ncard .nh .mo{margin-left:auto;color:var(--mute);letter-spacing:0;text-transform:none;font-weight:600}
.ncard a{display:block;padding:7px 0;border-top:1px solid #ffffff0d;color:inherit;text-decoration:none}
.ncard a:first-of-type{border-top:0}
.ncard a .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncard a .s{color:var(--mute);font-size:12px;margin-top:1px}
#tArtist{cursor:pointer}
.bandbtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 12px;border-radius:16px;background:#ffffff10;color:var(--mute);font-size:13px;font-weight:600}
.bandbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--acc)}
.bandbtn svg.i{width:16px;height:16px}
.bhero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 6px}
.bhero .pic{width:min(56vw,240px);aspect-ratio:1;border-radius:50%;background:#2c2621 center/cover no-repeat;box-shadow:0 10px 26px #000a;display:grid;place-items:center;color:#5d544b}
.bhero h2{margin:14px 0 4px;font-size:22px}
.status{display:inline-block;padding:4px 12px;border-radius:14px;font-size:13px;font-weight:700;margin-top:4px}
.status.on{background:#1f3a24;color:#7fdc8f}.status.off{background:#3a2a1f;color:var(--acc)}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.tags span{padding:3px 10px;border-radius:12px;background:var(--card);color:var(--mute);font-size:12px}
.ptxt p{margin:0 0 10px;color:#ddd3c8;line-height:1.5;user-select:text;-webkit-user-select:text}
.news a{display:block;padding:11px 2px;border-bottom:1px solid #2a241f;color:inherit;text-decoration:none}
.news .n{font-weight:600;line-height:1.3}
.news .s{color:var(--mute);font-size:12.5px;margin-top:3px}
.tl .row{min-height:44px}
.tl .yr{width:44px;color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.tl .own{font-size:11px;color:#7fdc8f;font-weight:700;flex:none}
.wlink{display:inline-block;margin-top:2px;color:var(--acc);font-weight:600}
.src{color:#6d6359;font-size:12px;text-align:center;margin-top:22px}
.spin{width:28px;height:28px;border:3px solid #3a332d;border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto 12px}

/* ---------- Reiter Platten / Podcasts ---------- */
.seg{display:flex;background:#ffffff12;border-radius:20px;padding:3px}
.seg button{padding:6px 14px;border-radius:17px;font-size:13.5px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--txt);color:var(--bg)}
#pod{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:calc(var(--safe-t) + 10px)}
#pod .top{padding:0 16px}
.psearch{margin:8px 14px 4px;flex:none!important}
.pbody{flex:1;overflow-y:auto;padding:0 14px calc(var(--safe-b) + 96px)}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.hscroll::-webkit-scrollbar{display:none}
.ccard{flex:none;width:150px;text-align:left}
.ccard .cv{width:150px;height:150px;border-radius:10px;background:#2c2621 center/cover no-repeat;position:relative;box-shadow:0 4px 10px #0007}
.ccard .cv .pb{position:absolute;left:8px;right:8px;bottom:8px;height:4px;border-radius:2px;background:#0009}
.ccard .cv .pb i{display:block;height:100%;border-radius:2px;background:var(--acc)}
.ccard .cv .pl{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:#000a;display:grid;place-items:center}
.ccard .n{font-weight:600;font-size:13.5px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .s{color:var(--mute);font-size:12px;margin-top:2px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.pgrid .pc{position:relative;text-align:left}
.pgrid .pc .cv{aspect-ratio:1;border-radius:10px;background:#2c2621 center/cover no-repeat;box-shadow:0 4px 10px #0007;display:grid;place-items:center;color:#5d544b;font-weight:700;font-size:12px;text-align:center;padding:6px}
.pgrid .pc .badge{position:absolute;top:-5px;right:-5px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--acc);color:#1a120b;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px #0008}
.pgrid .pc .n{font-size:12.5px;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 10px;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:6px 13px;border-radius:16px;background:var(--card);color:var(--mute);font-weight:600;font-size:13px}
.chips button.on{background:var(--txt);color:var(--bg)}
.secrow{display:flex;align-items:center;justify-content:space-between}
.secrow .lnk{color:var(--acc);font-size:13px;font-weight:600;padding:6px 0}
.ep{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #2a241f;align-items:flex-start}
.ep .th{width:52px;height:52px;border-radius:8px;background:#2c2621 center/cover no-repeat;flex:none}
.ep .tx{flex:1;min-width:0}
.ep .tx .pn{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .tx .n{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep.done .tx .n{color:var(--mute);font-weight:500}
.ep .tx .m{color:var(--mute);font-size:12.5px;margin-top:3px;display:flex;align-items:center;gap:8px}
.ep .tx .m .bar{flex:0 0 60px;height:3px;border-radius:2px;background:#4a423b;overflow:hidden}
.ep .tx .m .bar i{display:block;height:100%;background:var(--acc)}
.ep .tx .m .q{color:var(--acc)}
.ep .eb{display:flex;flex-direction:column;align-items:center;gap:2px}
.ep .pp{width:40px;height:40px;border-radius:50%;border:1.5px solid #5a5048;display:grid;place-items:center;color:var(--txt)}
.ep .pp svg.i{width:18px;height:18px;fill:currentColor;stroke:none}
.ep.cur .pp{background:var(--acc);border-color:var(--acc);color:#1a120b}
.ep.cur .tx .n{color:var(--acc)}
.ep .more{width:36px;height:30px;display:grid;place-items:center;color:var(--mute)}
.ep .ord{display:flex;flex-direction:column}
.ep .ord button{width:34px;height:28px;display:grid;place-items:center;color:var(--mute)}
.pdesc{color:#cfc5ba;line-height:1.5;white-space:pre-line;user-select:text;-webkit-user-select:text}
.pdesc.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.phero{display:flex;gap:14px;align-items:flex-start;padding:4px 0 6px}
.phero .big{width:120px;height:120px;border-radius:12px;background:#2c2621 center/cover no-repeat;flex:none;box-shadow:0 8px 20px #000a}
.phero h2{margin:0 0 4px;font-size:19px;line-height:1.25}
.phero .s{color:var(--mute);font-size:13.5px}
.subbtn{margin-top:10px;height:38px;padding:0 16px;border-radius:19px;background:linear-gradient(180deg,#f2b65d,var(--acc2));color:#1a120b;font-weight:700}
.subbtn.on{background:var(--card);color:var(--txt)}
.inp{display:flex;gap:8px;margin:6px 0}
.inp input{flex:1;min-width:0;height:44px;border-radius:12px;border:0;background:var(--card);padding:0 12px;outline:0}
.inp button{height:44px;padding:0 14px;border-radius:12px;background:var(--card);font-weight:700}
.inp button.pri{background:linear-gradient(180deg,#f2b65d,var(--acc2));color:#1a120b}
.res{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #2a241f}
.res .th{width:56px;height:56px;border-radius:8px;background:#2c2621 center/cover no-repeat;flex:none}
.res .tx{flex:1;min-width:0}.res .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .s{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .add{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--acc);flex:none}
.res .add.on{background:#1f3a24;color:#7fdc8f}
.pmini{position:absolute;z-index:8;left:10px;right:10px;bottom:calc(var(--safe-b) + 10px);height:64px;border-radius:14px;background:#2b2520f2;
  display:flex;align-items:center;gap:10px;padding:0 6px 0 8px;box-shadow:0 8px 20px #0009;overflow:hidden}
.pmini .th{width:48px;height:48px;border-radius:8px;background:#444 center/cover;flex:none}
.pmini .tx{flex:1;min-width:0}.pmini .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmini .s{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmini .pr{position:absolute;left:0;bottom:0;height:3px;background:var(--acc)}
.pmini .ibtn svg.f{fill:currentColor;stroke:none}
.skip{position:relative}
.skip b{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;font-weight:800;padding-top:2px}
.pplayer{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
.pplayer .big{width:min(74vw,320px);aspect-ratio:1;border-radius:14px;background:#2c2621 center/cover no-repeat;box-shadow:0 14px 34px #000b}
.pplayer h2{font-size:19px;margin:18px 0 4px;line-height:1.3}
.pplayer .s{color:var(--mute)}
.pplayer .prog{width:100%}
.pplayer .ctl{width:100%;justify-content:center;gap:22px}
.dlb{color:var(--acc);font-weight:700;white-space:nowrap}.dlb.ok{color:#7fdc8f}
.acts button.on{color:var(--acc)}
.pextra{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.pextra button{height:38px;padding:0 14px;border-radius:19px;background:var(--card);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px}

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>{ms=Math.max(0,Math.round((ms||0)/1000));const h=Math.floor(ms/3600),m=Math.floor(ms/60)%60,s=ms%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0');};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const store={get(k,d){try{const v=localStorage.getItem('mp_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('mp_'+k,JSON.stringify(v));}catch(e){}}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),2200);}

/* ===== Verbindung zur Android-App (im Browser: Vorführmodus mit Beispielalben) ===== */
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
function nativePlugin(n){try{if(Capacitor.Plugins&&Capacitor.Plugins[n])return Capacitor.Plugins[n];if(typeof Capacitor.registerPlugin==='function')return Capacitor.registerPlugin(n);}catch(e){}return null;}
const Music=NATIVE?nativePlugin('Music'):demoPlugin();
const AppP=NATIVE?nativePlugin('App'):null;

function demoPlugin(){
  const names=[['Abendrot','Die Gipfelstürmer','#c0542d'],['Blaue Stunde','Nora Lindqvist','#2d5fc0'],['Wetterstein','Die Gipfelstürmer','#5a7a3a'],
    ['Neon Nights','Kaspar & die Synths','#a02db0'],['Seidenstraße','Ensemble Orient','#c09a2d'],['Loisach Blues','Ferdl Huber Trio','#2d9ab0'],
    ['Kaffeehaus','Nora Lindqvist','#7a4a2d'],['Schneefall','Polarlicht','#8aa0b0'],['Wilde Jahre','Kaspar & die Synths','#b02d4a'],['Alpenglühen','Polarlicht','#d0702d']];
  const tr=[];let id=1;
  names.forEach((a,ai)=>{const n=7+ai%5;for(let i=1;i<=n;i++)tr.push([id++,['Intro','Morgenlicht','Über den Grat','Nachtzug','Leise','Heimweg','Sturm','Echo','Finale','Zugabe','Bonus'][i-1]||('Titel '+i),a[1],a[0],ai+1,150000+((id*7919)%160000),i,2015+ai,'Music/'+a[1]+'/'+a[0]+'/','',a[1]]);});
  const cov=ai=>{const a=names[ai-1];const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a[2]}"/><stop offset="1" stop-color="#111"/></linearGradient></defs><rect width="300" height="300" fill="url(#g)"/><circle cx="${80+ai*17%140}" cy="${90+ai*29%120}" r="${40+ai*9%50}" fill="#fff2"/><path d="M0 ${200+ai*7%60} L${100+ai*11%80} ${130+ai*13%50} L300 ${210+ai*5%40} V300 H0z" fill="#0005"/><text x="20" y="270" font-family="sans-serif" font-size="26" font-weight="700" fill="#fff">${a[0]}</text></svg>`;return 'data:image/svg+xml;utf8,'+encodeURIComponent(s);};
  let st={ready:true,playing:false,index:0,count:0,id:'',pos:0,dur:0,shuffle:false,repeat:0},q=[],L={};
  setInterval(()=>{if(st.playing){st.pos+=500;if(st.pos>=st.dur){if(st.index<q.length-1){st.index++;st.id=String(q[st.index].id);st.dur=q[st.index].dur;st.pos=0;}else{st.playing=false;st.pos=st.dur;}emit();}}},500);
  const emit=()=>(L.state||[]).forEach(f=>f({...st}));
  return{
    status:async()=>({granted:true}),request:async()=>({granted:true}),
    scan:async()=>({tracks:tr}),
    art:async({album})=>({url:cov(album)}),
    getState:async()=>({...st}),
    play:async({tracks,index,shuffle,start})=>{q=tracks.map(t=>({id:t.key||t.id,dur:(tr.find(x=>x[0]==t.id)||[])[5]||(t.key?1800000:200000)}));st={...st,playing:true,index,count:q.length,id:String(q[index].id),pos:start||0,dur:q[index].dur};if(shuffle!=null)st.shuffle=shuffle;emit();return{...st};},
    control:async({action,ms,index,on,mode})=>{if(action==='toggle')st.playing=!st.playing;if(action==='seek')st.pos=ms;if(action==='shuffle')st.shuffle=on;if(action==='repeat')st.repeat=mode;
      if((action==='next'&&st.index<q.length-1)||(action==='prev'&&st.index>0)||action==='jump'){st.index=action==='jump'?index:st.index+(action==='next'?1:-1);st.id=String(q[st.index].id);st.dur=q[st.index].dur;st.pos=0;}
      emit();return{...st};},
    addListener:(e,f)=>{(L[e]=L[e]||[]).push(f);return{remove(){}};}
  };
}

/* ===== Bibliothek ===== */
let tracks=[],byId=new Map(),albums=[],albumById=new Map(),artists=[],folders=[];
let playlists=store.get('playlists',[]);
const savePl=()=>store.set('playlists',playlists);

function buildLibrary(raw){
  tracks=raw.map(r=>({id:r[0],title:r[1]||r[9]||'Unbekannt',artist:r[2]||'Unbekannter Interpret',album:r[3]||'Unbekanntes Album',albumId:r[4],dur:r[5],no:r[6]||0,year:r[7]||0,path:r[8]||'',file:r[9]||'',albumArtist:r[10]||''}));
  byId=new Map(tracks.map(t=>[t.id,t]));
  const am=new Map();
  for(const t of tracks){let a=am.get(t.albumId);if(!a){a={id:t.albumId,name:t.album,tracks:[],year:0};am.set(t.albumId,a);}a.tracks.push(t);if(t.year>a.year)a.year=t.year;}
  albums=[...am.values()];
  for(const a of albums){
    a.tracks.sort((x,y)=>(x.no||9999)-(y.no||9999)||x.file.localeCompare(y.file));
    const cnt={};a.tracks.forEach(t=>cnt[t.albumArtist||t.artist]=(cnt[t.albumArtist||t.artist]||0)+1);
    const ks=Object.keys(cnt);a.artist=ks.length>2&&!a.tracks[0].albumArtist?'Verschiedene Interpreten':ks.sort((x,y)=>cnt[y]-cnt[x])[0];
    a.dur=a.tracks.reduce((s,t)=>s+t.dur,0);a.key=norm(a.name+' '+a.artist);
  }
  albums.sort((x,y)=>x.name.localeCompare(y.name,'de',{sensitivity:'base'}));
  albumById=new Map(albums.map(a=>[a.id,a]));
  const ar=new Map();
  for(const t of tracks){const n=t.albumArtist||t.artist;let a=ar.get(n);if(!a){a={name:n,tracks:[],albums:new Set()};ar.set(n,a);}a.tracks.push(t);a.albums.add(t.albumId);}
  artists=[...ar.values()].sort((x,y)=>x.name.localeCompare(y.name,'de',{sensitivity:'base'}));
  const fm=new Map();
  for(const t of tracks){let f=fm.get(t.path);if(!f){f={path:t.path,tracks:[]};fm.set(t.path,f);}f.tracks.push(t);}
  folders=[...fm.values()].sort((x,y)=>x.path.localeCompare(y.path,'de',{sensitivity:'base'}));
  folders.forEach(f=>{f.name=f.path.replace(/\/$/,'').split('/').pop()||'Hauptordner';f.tracks.sort((x,y)=>x.file.localeCompare(y.file,'de',{numeric:true}));});
  tracks.forEach(t=>t.key=norm(t.title+' '+t.artist+' '+t.album));
  tracks.sort((x,y)=>x.title.localeCompare(y.title,'de',{sensitivity:'base'}));
}

/* Cover laden (nach Bedarf, zwischengespeichert) */
const artCache=new Map(),artWait=new Map();
function art(albumId,size){
  const k=albumId+'@'+size;
  if(artCache.has(k))return Promise.resolve(artCache.get(k));
  if(artWait.has(k))return artWait.get(k);
  const a=albumById.get(albumId);
  const p=Music.art({album:albumId,track:a&&a.tracks[0]?a.tracks[0].id:-1,size}).then(r=>r.url).catch(()=>null).then(u=>{artCache.set(k,u);artWait.delete(k);return u;});
  artWait.set(k,p);return p;
}
const io=new IntersectionObserver(es=>{for(const e of es){if(!e.isIntersecting)continue;const el=e.target;io.unobserve(el);
  art(+el.dataset.art,+el.dataset.size||300).then(u=>{if(u){el.style.backgroundImage=`url("${u}")`;const ph=el.querySelector('.ph');if(ph)ph.remove();}});}},{rootMargin:'300px'});
function lazy(root){root.querySelectorAll('[data-art]').forEach(el=>io.observe(el));}

/* ===== Wiedergabe ===== */
let queue=store.get('queue',[]).map(Number);
let S={playing:false,index:store.get('qi',0),pos:0,dur:0,shuffle:false,repeat:0,id:''};
let deckAlbum=null,swapping=false,lastPosAt=0;

async function playList(list,index=0,shuffle=null){
  if(!list.length)return;
  queue=list.map(t=>t.id);store.set('queue',queue);store.set('qi',index);
  if(shuffle===true&&index===0)index=Math.floor(Math.random()*list.length);
  try{onState(await Music.play({tracks:list.map(t=>({id:t.id,title:t.title,artist:t.artist,album:t.album})),index,shuffle,speed:1}));}
  catch(e){toast('Abspielen fehlgeschlagen');}
}
async function ctl(action,extra){try{onState(await Music.control({action,...extra}));}catch(e){}}

function curTrack(){if(String(S.id||'').startsWith('p:'))return null;return byId.get(+S.id)||byId.get(queue[S.index])||null;}

function onState(s){
  if(!s||s.ready===false)return;
  s={...s};
  if(!s.count){delete s.index;s.id='';}   // Dienst hat nichts geladen: zuletzt aufgelegte Platte nur anzeigen
  Object.assign(S,s);lastPosAt=Date.now();
  if(s.index!=null&&!String(s.id||'').startsWith('p:')) store.set('qi',s.index);
  render();
}

function render(){
  const t=curTrack();
  const playing=!!S.playing&&!!t;
  $('#main').classList.toggle('playing',playing&&!swapping);
  $('#playIco').setAttribute('href',playing?'#i-pause':'#i-play');
  $('#miniIco').setAttribute('href',playing?'#i-pause':'#i-play');
  $('#bShuf').classList.toggle('on',!!S.shuffle);
  $('#bRep').classList.toggle('on',S.repeat>0);
  $('#rep1').classList.toggle('hidden',S.repeat!==1);
  $('#tTitle').textContent=t?t.title:(tracks.length?'Leg eine Platte auf':' ');
  $('#tArtist').textContent=t?t.artist+' · '+t.album:(tracks.length?tracks.length+' Titel in '+albums.length+' Alben':' ');
  setDeck(t?t.albumId:null);
  updateBandBtn(t);
  if(window.pcRender)pcRender();
  const mini=$('#mini');
  mini.classList.toggle('show',!!t&&$('#lib').classList.contains('open'));
  mini.classList.toggle('playing',playing);
  if(t){$('#miniT').textContent=t.title;$('#miniA').textContent=t.artist;
    art(t.albumId,300).then(u=>{$('#miniArt').style.backgroundImage=u?`url("${u}")`:'';});}
  document.querySelectorAll('.row[data-id]').forEach(r=>r.classList.toggle('cur',t&&+r.dataset.id===t.id));
  tick();
}

/* Platte wechseln: alte fliegt nach links weg, neue kommt von rechts und legt sich auf den Teller */
function setDeck(albumId){
  if(albumId===deckAlbum)return;
  const rec=$('#record'),old=deckAlbum;deckAlbum=albumId;
  const put=()=>{
    if(albumId==null){rec.className='record off';$('#emptyTxt').classList.remove('hidden');return;}
    const a=albumById.get(albumId);
    $('#lbl').style.backgroundImage='';$('#lblTxt').textContent=a?a.name:'';
    art(albumId,700).then(u=>{if(deckAlbum!==albumId)return;if(u){$('#lbl').style.backgroundImage=`url("${u}")`;$('#lblTxt').textContent='';}});
    rec.style.transition='none';rec.className='record off';void rec.offsetWidth;rec.style.transition='';
    $('#emptyTxt').classList.add('hidden');
    requestAnimationFrame(()=>{rec.className='record';});
    setTimeout(()=>{swapping=false;render();},650);
  };
  swapping=true;$('#main').classList.remove('playing');
  if(old!=null){rec.className='record leave';setTimeout(put,450);}else put();
}

/* Fortschritt + Tonarm (wandert über die ganze Platte von außen nach innen) */
let seeking=false;
function tick(){
  const t=curTrack();
  let pos=S.pos||0;if(S.playing&&!swapping)pos+=Date.now()-lastPosAt;
  const dur=S.dur||(t?t.dur:0);pos=Math.min(pos,dur||pos);
  if(!seeking){$('#seek').value=dur?Math.round(pos/dur*1000):0;$('#seek').style.setProperty('--p',(dur?pos/dur*100:0)+'%');}
  $('#tPos').textContent=fmt(seeking?$('#seek').value/1000*dur:pos);$('#tDur').textContent=fmt(dur);
  let ang=0;
  if(t&&deckAlbum!=null&&!swapping&&(S.playing||pos>0)){
    const a=albumById.get(t.albumId),list=a?a.tracks:[t];
    const i=Math.max(0,list.findIndex(x=>x.id===t.id));
    const total=list.reduce((s,x)=>s+x.dur,0)||1,before=list.slice(0,i).reduce((s,x)=>s+x.dur,0);
    const f=Math.min(1,(before+pos)/total);
    ang=17.5+f*11.5;   // 17,5° = äußere Rille, 29° = kurz vor dem Etikett
  }
  if(!S.playing&&pos===0)ang=0;
  $('#arm').style.transform=`rotate(${ang}deg)`;
}
setInterval(()=>{if(S.playing&&!document.hidden)tick();},500);

/* ===== Bedienung Plattenspieler ===== */
$('#bPlay').onclick=()=>{
  if(!curTrack()){openLib();return;}
  if(!S.id&&queue.length){const l=queue.map(i=>byId.get(i)).filter(Boolean);playList(l,Math.min(S.index||0,l.length-1));return;}
  ctl('toggle');
};
$('#record').onclick=()=>$('#bPlay').click();
$('#bNext').onclick=()=>ctl('next');
$('#bPrev').onclick=()=>ctl('prev');

const seek=$('#seek');
seek.oninput=()=>{seeking=true;seek.style.setProperty('--p',seek.value/10+'%');tick();};
seek.onchange=()=>{const dur=S.dur||(curTrack()||{}).dur||0;ctl('seek',{ms:Math.round(seek.value/1000*dur)});seeking=false;};

/* ===== Bibliothek-Ansichten ===== */
let tab=store.get('tab','albums'),query='';
function openLib(){$('#lib').classList.add('open');renderLib();render();pushNav('lib');}
function closeLib(){$('#lib').classList.remove('open');$('#mini').classList.remove('show');}
$('#libClose').onclick=()=>{closeLib();nav=nav.filter(x=>x!=='lib');};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;store.set('tab',tab);renderLib();$('#libBody').scrollTop=0;};
$('#q').oninput=()=>{query=norm($('#q').value.trim());renderLib();};
$('#libScan').onclick=async()=>{await loadLibrary(true);};

const albumCard=a=>`<button class="alb" data-alb="${a.id}"><div class="cv" data-art="${a.id}" data-size="300"><div class="ph"><svg class="i" style="width:40px;height:40px"><use href="#i-vinyl"/></svg></div></div><div class="n">${esc(a.name)}</div><div class="s">${esc(a.artist)}</div></button>`;
function trackRow(t,o={}){
  const lead=o.nr!=null?`<div class="nr">${o.nr}</div>`:`<div class="th" data-art="${t.albumId}" data-size="150"><div class="ph"><svg class="i" style="width:20px"><use href="#i-note"/></svg></div></div>`;
  const cur=curTrack();
  return `<div class="row${cur&&cur.id===t.id?' cur':''}" data-id="${t.id}"${o.qi!=null?` data-qi="${o.qi}"`:''}>${lead}<div class="tx"><div class="n">${esc(t.title)}</div><div class="s">${esc(o.sub||t.artist+(o.nr==null?' · '+t.album:''))}</div></div><div class="d">${fmt(t.dur)}</div><button class="more" aria-label="Mehr"><svg class="i" style="width:20px"><use href="#i-more"/></svg></button></div>`;
}

function renderLib(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const B=$('#libBody');
  if(!tracks.length){B.innerHTML=`<div class="hint">Keine Musik gefunden.<br>Lege MP3-, FLAC- oder M4A-Dateien z. B. in den Ordner <b>Music</b> auf dem Handy und tippe oben auf ↻.</div>`;return;}
  let h='';
  if(query){
    const al=albums.filter(a=>a.key.includes(query)).slice(0,30);
    const ar=artists.filter(a=>norm(a.name).includes(query)).slice(0,20);
    const tr=tracks.filter(t=>t.key.includes(query)).slice(0,150);
    if(al.length)h+=`<div class="sec">Alben</div><div class="grid">${al.map(albumCard).join('')}</div>`;
    if(ar.length)h+=`<div class="sec">Interpreten</div><div class="list">${ar.map(artistRow).join('')}</div>`;
    if(tr.length)h+=`<div class="sec">Titel</div><div class="list">${tr.map(t=>trackRow(t)).join('')}</div>`;
    if(!h)h=`<div class="hint">Nichts gefunden für „${esc($('#q').value)}“</div>`;
  }else if(tab==='albums'){
    h=`<div class="sec">${albums.length} Alben</div><div class="grid">${albums.map(albumCard).join('')}</div>`;
  }else if(tab==='artists'){
    h=`<div class="sec">${artists.length} Interpreten</div><div class="list">${artists.map(artistRow).join('')}</div>`;
  }else if(tab==='folders'){
    h=`<div class="sec">${folders.length} Ordner</div><div class="list">${folders.map((f,i)=>`<div class="row" data-fold="${i}"><div class="th"><svg class="i"><use href="#i-folder"/></svg></div><div class="tx"><div class="n">${esc(f.name)}</div><div class="s">${esc(f.path)} · ${f.tracks.length} Titel</div></div></div>`).join('')}</div>`;
  }else if(tab==='tracks'){
    h=`<div class="acts"><button class="pri" data-act="alltracks"><svg class="i" style="fill:currentColor;stroke:none"><use href="#i-play"/></svg>Alle abspielen</button><button data-act="allshuf"><svg class="i"><use href="#i-shuf"/></svg>Zufall</button></div><div class="sec">${tracks.length} Titel</div><div class="list" id="tlist"></div>`;
  }else if(tab==='playlists'){
    h=`<div class="list"><div class="row" data-act="newpl"><div class="th" style="color:var(--acc)"><svg class="i"><use href="#i-plus"/></svg></div><div class="tx"><div class="n">Neue Playlist</div></div></div>${playlists.map((p,i)=>{const f=byId.get(p.ids.find(x=>byId.has(x)));return `<div class="row" data-pl="${i}"><div class="th"${f?` data-art="${f.albumId}" data-size="150"`:''}><svg class="i ph"><use href="#i-list"/></svg></div><div class="tx"><div class="n">${esc(p.name)}</div><div class="s">${p.ids.filter(x=>byId.has(x)).length} Titel</div></div></div>`;}).join('')}</div>${playlists.length?'':'<div class="hint">Titel fügst du über ⋮ neben jedem Lied hinzu.</div>'}`;
  }
  B.innerHTML=h;
  if(tab==='tracks'&&!query){let n=0;const L=$('#tlist');const more=()=>{L.insertAdjacentHTML('beforeend',tracks.slice(n,n+200).map(t=>trackRow(t)).join(''));n+=200;lazy(L);};more();
    B.onscroll=()=>{if(n<tracks.length&&B.scrollTop+B.clientHeight>B.scrollHeight-800)more();};}else B.onscroll=null;
  lazy(B);
}
const artistRow=a=>{const first=[...a.albums][0];return `<div class="row" data-artist="${esc(a.name)}"><div class="th round" data-art="${first}" data-size="150"><svg class="i ph"><use href="#i-user"/></svg></div><div class="tx"><div class="n">${esc(a.name)}</div><div class="s">${a.albums.size} ${a.albums.size===1?'Album':'Alben'} · ${a.tracks.length} Titel</div></div></div>`;};

/* Klicks in der Bibliothek */
$('#libBody').onclick=e=>handleListClick(e,null);
function handleListClick(e,ctxList){
  const alb=e.target.closest('[data-alb]');if(alb){openAlbum(+alb.dataset.alb);return;}
  const art=e.target.closest('[data-artist]');if(art){openArtist(art.dataset.artist);return;}
  const fo=e.target.closest('[data-fold]');if(fo){const f=folders[+fo.dataset.fold];openTrackView(f.name,f.path,f.tracks);return;}
  const pl=e.target.closest('[data-pl]');if(pl){openPlaylist(+pl.dataset.pl);return;}
  const act=e.target.closest('[data-act]');
  if(act){const a=act.dataset.act;
    if(a==='newpl'){newPlaylist();return;}
    if(a==='alltracks'){playList(tracks,0,false);closeAll();return;}
    if(a==='allshuf'){playList(tracks,0,true);closeAll();return;}}
  const row=e.target.closest('.row[data-id]');
  if(row){const t=byId.get(+row.dataset.id);
    if(e.target.closest('.more')){trackMenu(t);return;}
    const list=ctxList||(tab==='tracks'&&!query?tracks:null);
    if(list){playList(list,list.findIndex(x=>x.id===t.id),false);}
    else{const a=albumById.get(t.albumId);playList(a.tracks,a.tracks.indexOf(t),false);}
    closeAll();}
}

/* Unteransichten (übereinander gestapelt, Zurück-Taste schließt die oberste) */
function openView(title,fill){

  document.body.insertBefore(v,$('#mini'));
  v.querySelector('.bk').onclick=()=>back();
  fill(v.querySelector('.vbody'),v);
  requestAnimationFrame(()=>requestAnimationFrame(()=>v.classList.add('open')));
  pushNav(v);return v;
}
function hero(cover,title,sub){return `<div class="hero"><div class="big"${cover!=null?` data-art="${cover}" data-size="700"`:''}></div><h2>${esc(title)}</h2><div class="s">${esc(sub)}</div></div>`;}
function actBtns(){return `<div class="acts"><button class="pri" data-go="play"><svg class="i"><use href="#i-vinyl"/></svg>Auflegen</button><button data-go="shuf"><svg class="i"><use href="#i-shuf"/></svg>Zufall</button></div>`;}
function wireList(b,list){b.onclick=e=>{const g=e.target.closest('[data-go]');if(g){playList(list,0,g.dataset.go==='shuf');closeAll();return;}handleListClick(e,list);};}

function openAlbum(id){

function openArtist(name){
  const a=artists.find(x=>x.name===name);if(!a)return;

function openTrackView(title,sub,list){

function openPlaylist(i){
  const p=playlists[i];if(!p)return;

    ['i-trash','Playlist löschen',()=>{if(confirm('Playlist „'+p.name+'“ löschen?')){playlists.splice(i,1);savePl();back();renderLib();}},'del']]);

function newPlaylist(addId){

/* Menü für einen Titel */
function trackMenu(t,o={}){
  if(!t)return;
  const items=[
    ['i-play','Jetzt abspielen',()=>{playList([t],0,false);closeAll();}],
    ['i-vinyl','Album öffnen',()=>openAlbum(t.albumId)],
    ['i-user','Interpret öffnen',()=>openArtist(t.albumArtist||t.artist)],
    ['i-news','News & Infos zur Band',()=>openBand(t.artist)],
    ['i-plus','Zu Playlist hinzufügen…',()=>setTimeout(()=>addToPl(t),260)]];

  menu(t.title+' · '+t.artist,items);

/* ===== Band-Infos: aktiv -> News, aufgelöst -> Highlights =====
   Quellen: MusicBrainz (Status, Alben), Wikipedia (Text, Bild), Google News (Meldungen) */
const UA='bTUNES/1.0 ( https://github.com/BarneyGamble332/bTUNES )';
const BrowserP=NATIVE?nativePlugin('Browser'):null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function openUrl(u){if(BrowserP)BrowserP.open({url:u}).catch(()=>window.open(u,'_blank'));else window.open(u,'_blank');}
async function getJSON(u,h={}){const r=await fetch(u,{headers:{Accept:'application/json',...h}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
let mbLast=0;   // MusicBrainz erlaubt höchstens eine Anfrage pro Sekunde
async function mb(path){const w=mbLast+1100-Date.now();if(w>0)await sleep(w);mbLast=Date.now();return getJSON('https://musicbrainz.org/ws/2/'+path+(path.includes('?')?'&':'?')+'fmt=json',{'User-Agent':UA});}

async function bandInfo(name){
  const key='bi_'+norm(name),c=store.get(key,null);
  if(c&&Date.now()-c.t<20*864e5)return c.d;
  if(!NATIVE)return demoBand(name);
  const res=await mb('artist?limit=5&query='+encodeURIComponent('artist:"'+name+'"'));
  const list=res.artists||[];
  const a=list.find(x=>norm(x.name)===norm(name)&&x.score>=85)||list.find(x=>(x.aliases||[]).some(y=>norm(y.name)===norm(name)))||list.find(x=>x.score>=97);
  if(!a){const d={found:false};store.set(key,{t:Date.now(),d});return d;}
  const full=await mb('artist/'+a.id+'?inc=url-rels+tags+genres');
  const rgs=await mb('release-group?type=album&limit=100&artist='+a.id);
  const albums=(rgs['release-groups']||[]).filter(g=>!(g['secondary-types']||[]).length&&g['first-release-date'])
    .map(g=>({title:g.title,year:+g['first-release-date'].slice(0,4)})).sort((x,y)=>x.year-y.year);
  let wiki=null;
  try{
    const wd=(full.relations||[]).find(r=>r.type==='wikidata');
    let title=null,lang='de';
    if(wd){const q=wd.url.resource.split('/').pop();
      const e=await getJSON('https://www.wikidata.org/w/api.php?action=wbgetentities&props=sitelinks&sitefilter=dewiki|enwiki&format=json&origin=*&ids='+q);
      const sl=(e.entities&&e.entities[q]&&e.entities[q].sitelinks)||{};
      if(sl.dewiki)title=sl.dewiki.title;else if(sl.enwiki){title=sl.enwiki.title;lang='en';}}
    if(title){
      const w=await getJSON(`https://${lang}.wikipedia.org/w/api.php?action=query&prop=extracts|pageimages&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=600&redirects=1&format=json&origin=*&titles=`+encodeURIComponent(title));
      const pg=Object.values((w.query&&w.query.pages)||{})[0];
      if(pg&&pg.extract)wiki={title:pg.title,text:pg.extract,img:pg.thumbnail&&pg.thumbnail.source,lang,url:`https://${lang}.m.wikipedia.org/wiki/`+encodeURIComponent(pg.title.replace(/ /g,'_'))};
    }
  }catch(e){}
  const ls=full['life-span']||{};
  const tags=[...(full.genres||[]),...(full.tags||[])].sort((x,y)=>y.count-x.count).map(t=>t.name).filter((t,i,arr)=>arr.indexOf(t)===i).slice(0,5);
  const d={found:true,name:full.name,type:full.type,area:full.area&&full.area.name,begin:ls.begin||'',end:ls.end||'',ended:!!ls.ended,tags,albums,wiki};
  store.set(key,{t:Date.now(),d});
  return d;
}

async function bandNews(name,group){
  const key='bn_'+norm(name),c=store.get(key,null);
  if(c&&Date.now()-c.t<3*36e5)return c.d;
  if(!NATIVE)return demoNews(name);
  const q='"'+name+'"'+(group?' Band':'')+' when:1y';
  const r=await fetch('https://news.google.com/rss/search?hl=de&gl=DE&ceid=DE:de&q='+encodeURIComponent(q));
  if(!r.ok)throw new Error('HTTP '+r.status);
  const x=new DOMParser().parseFromString(await r.text(),'text/xml');
  const items=[...x.querySelectorAll('item')].map(it=>{
    const src=(it.querySelector('source')||{}).textContent||'';
    let t=(it.querySelector('title')||{}).textContent||'';
    if(src&&t.endsWith(' - '+src))t=t.slice(0,-(src.length+3));
    return{title:t,src,link:(it.querySelector('link')||{}).textContent||'',date:Date.parse((it.querySelector('pubDate')||{}).textContent||'')||0};
  }).filter(n=>n.title&&n.link&&Date.now()-n.date<365*864e5).sort((a,b)=>b.date-a.date).slice(0,12);
  store.set(key,{t:Date.now(),d:items});
  return items;
}

const ago=d=>{const m=Math.round((Date.now()-d)/6e4);if(m<60)return 'vor '+Math.max(1,m)+' Min.';const h=Math.round(m/60);if(h<24)return 'vor '+h+' Std.';const t=Math.round(h/24);if(t<31)return 'vor '+t+(t===1?' Tag':' Tagen');return new Date(d).toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'});};
const yr=s=>(s||'').slice(0,4);
function statusText(d){
  const person=d.type==='Person';
  if(d.ended)return person?`† ${yr(d.end)||'verstorben'}`:`Aufgelöst${d.end?' '+yr(d.end):''}`;
  return (person?'Aktiv':'Aktiv')+(d.begin?' seit '+yr(d.begin):'');
}

function openBand(name){
  if(!name)return;
  openView(name,async b=>{
    b.innerHTML=`<div class="spin"></div><div class="hint" style="padding-top:0">Suche Infos zu ${esc(name)}…</div>`;
    let d;
    try{d=await bandInfo(name);}catch(e){b.innerHTML=`<div class="hint">Keine Verbindung zum Internet.<br>Band-Infos brauchen Netz.</div>`;return;}
    if(!d.found){b.innerHTML=`<div class="hint">Zu „${esc(name)}“ habe ich nichts gefunden.<br>Vielleicht ist der Interpret anders geschrieben?</div>`;return;}
    const own=new Set(albums.map(a=>norm(a.name)));
    const paras=d.wiki?d.wiki.text.split(/\n+/).map(s=>s.trim()).filter(s=>s.length>30):[];
    const yrs=d.begin?yr(d.begin)+'–'+(d.ended?yr(d.end):'heute'):'';
    let h=`<div class="bhero"><div class="pic"${d.wiki&&d.wiki.img?` style="background-image:url('${esc(d.wiki.img)}')"`:''}>${d.wiki&&d.wiki.img?'':'<svg class="i" style="width:60px;height:60px"><use href="#i-user"/></svg>'}</div>
      <h2>${esc(d.name)}</h2><div class="s" style="color:var(--mute)">${esc([d.type==='Group'?'Band':d.type==='Person'?'Musiker:in':'',d.area,yrs].filter(Boolean).join(' · '))}</div>
      <div class="status ${d.ended?'off':'on'}">${esc(statusText(d))}</div>
      ${d.tags.length?`<div class="tags">${d.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}</div>`;
    const albumsHtml=d.albums.length?`<div class="sec">${d.ended?'Die Alben':'Alben'}</div><div class="list tl">${d.albums.map(a=>`<div class="row"><div class="yr">${a.year}</div><div class="tx"><div class="n">${esc(a.title)}</div></div>${own.has(norm(a.title))?'<div class="own">✓ HAST DU</div>':''}</div>`).join('')}</div>`:'';
    const wikiLink=d.wiki?`<a class="wlink" href="#" data-url="${esc(d.wiki.url)}">Mehr auf Wikipedia ›</a>`:'';
    if(d.ended){
      h+=`<div class="sec">Highlights</div><div class="ptxt">${paras.slice(0,5).map(p=>`<p>${esc(p)}</p>`).join('')||'<p>Keine Beschreibung gefunden.</p>'}</div>${wikiLink}`+albumsHtml;
    }else{
      h+=`<div class="sec">Aktuelles</div><div class="news" id="newsBox"><div class="spin" style="margin:14px auto"></div></div>`+
        (paras.length?`<div class="sec">Über ${d.type==='Person'?'den Künstler':'die Band'}</div><div class="ptxt"><p>${esc(paras[0])}</p></div>${wikiLink}`:'')+albumsHtml;
    }
    h+=`<div class="src">Quellen: MusicBrainz${d.wiki?', Wikipedia':''}${d.ended?'':', Google News'}</div>`;
    b.innerHTML=h;
    b.onclick=e=>{const a=e.target.closest('[data-url]');if(a){e.preventDefault();openUrl(a.dataset.url);}};
    if(!d.ended){
      const box=b.querySelector('#newsBox');
      try{const n=await bandNews(d.name,d.type!=='Person');
        box.innerHTML=n.length?n.map(x=>`<a href="#" data-url="${esc(x.link)}"><div class="n">${esc(x.title)}</div><div class="s">${esc(x.src)}${x.src?' · ':''}${ago(x.date)}</div></a>`).join(''):'<div class="hint" style="padding:16px">Keine Meldungen aus dem letzten Jahr.</div>';
        markSeen(d.name,n);}
      catch(e){box.innerHTML='<div class="hint" style="padding:16px">News konnten nicht geladen werden.</div>';}
    }
  });
}

/* ===================== PODCASTS =====================
   Abos per RSS, Suche im Apple-Podcast-Verzeichnis, Beliebt-Liste, OPML-Import,
   Ordner, "Meine Liste" (eigene Reihenfolge), Weiterhören, Tempo, Schlaf-Timer */
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);};
let pods=store.get('pods',[]);             // Abos
let pcats=store.get('pcats',[]);           // eigene Ordner
let plist=store.get('plist',[]);           // Meine Liste: Folgen-Schlüssel
let pst=store.get('pst',{});               // Fortschritt je Folge {p:Position ms, d:Dauer ms, x:fertig, t:zuletzt}
let pcSpeed=store.get('pspeed',1);
let pcCat=store.get('pcat','Alle'),pcSort=store.get('psort','neu');
const eps=new Map();                       // Folgen-Schlüssel -> Folge
const podById=new Map();
const savePods=()=>{store.set('pods',pods);podById.clear();pods.forEach(p=>podById.set(p.id,p));};
const savePst=()=>{store.set('pst',pst);if(window.dlClean)dlClean();};
function podEps(id){return store.get('pe_'+id,[]);}
function indexEps(p,list){for(const e of list){e.pid=p.id;eps.set(e.k,e);}}
pods.forEach(p=>{podById.set(p.id,p);indexEps(p,podEps(p.id));});

function htmlText(h){
  if(!h)return '';
  h=String(h).replace(/<(br|\/p|\/div|\/li|\/h\d)[^>]*>/gi,'\n').replace(/<li[^>]*>/gi,'• ');
  const t=new DOMParser().parseFromString('<body>'+h+'</body>','text/html').body.textContent||'';
  return t.replace(/[ \t ]+/g,' ').replace(/\n\s*\n\s*\n+/g,'\n\n').trim();
}
function durSec(v){if(!v)return 0;v=String(v).trim();if(/^\d+$/.test(v))return +v;const p=v.split(':').map(Number);return p.reduce((s,x)=>s*60+(x||0),0);}
const fmtMin=sec=>{if(!sec)return '';const m=Math.round(sec/60);return m<60?m+' Min.':Math.floor(m/60)+' Std. '+(m%60?m%60+' Min.':'');};
const fmtDate=d=>{if(!d)return '';const x=new Date(d),n=new Date();const days=Math.floor((n-x)/864e5);
  if(days<1&&x.getDate()===n.getDate())return 'Heute';if(days<2)return 'Gestern';if(days<7)return x.toLocaleDateString('de-DE',{weekday:'long'});
  return x.toLocaleDateString('de-DE',x.getFullYear()===n.getFullYear()?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'});};

async function fetchText(u){
  if(!NATIVE)return demoFeed(u);
  const r=await fetch(u,{headers:{'User-Agent':UA,Accept:'application/rss+xml, application/xml, text/xml, */*'}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.text();
}
/* RSS-Feed lesen */
function parseFeed(xml,url){
  const x=new DOMParser().parseFromString(xml,'text/xml');
  const ch=x.querySelector('channel');
  if(!ch)throw new Error('Kein Podcast-Feed');
  const kid=(el,name)=>{for(const c of el.children)if(c.tagName===name)return c;return null;};
  const txt=(el,...names)=>{for(const n of names){const c=kid(el,n);if(c&&c.textContent.trim())return c.textContent.trim();}return '';};
  const img=(el)=>{const i=kid(el,'itunes:image');if(i&&i.getAttribute('href'))return i.getAttribute('href');const j=kid(el,'image');if(j){const u=kid(j,'url');if(u)return u.textContent.trim();}return '';};
  const id=hash(url);
  const p={id,url,title:txt(ch,'title')||url,author:txt(ch,'itunes:author','author','managingEditor'),art:img(ch),
    desc:htmlText(txt(ch,'itunes:summary','description')).slice(0,1500),link:txt(ch,'link')};
  const list=[];
  for(const it of ch.getElementsByTagName('item')){
    const enc=kid(it,'enclosure');const u=enc&&enc.getAttribute('url');if(!u)continue;
    const g=txt(it,'guid')||u;
    list.push({k:id+'.'+hash(g),t:txt(it,'title')||'Ohne Titel',d:Date.parse(txt(it,'pubDate'))||0,s:durSec(txt(it,'itunes:duration')),u:u.replace(/&amp;/g,'&'),
      i:img(it),x:htmlText(txt(it,'content:encoded','description','itunes:summary')).slice(0,2500)});
  }
  list.sort((a,b)=>b.d-a.d);
  return {p,list:list.slice(0,300)};
}
async function loadFeed(url){return parseFeed(await fetchText(url),url);}

async function subscribe(url,quiet){
  url=url.trim();if(!/^https?:\/\//i.test(url))url='https://'+url;
  const id=hash(url);
  if(podById.has(id)){if(!quiet)toast('Schon abonniert');return podById.get(id);}
  const {p,list}=await loadFeed(url);
  p.added=Date.now();p.upd=Date.now();p.cat='';
  pods.push(p);savePods();store.set('pe_'+p.id,list);indexEps(p,list);
  if(!quiet)toast('„'+p.title+'“ abonniert');
  pcRenderHome();return p;
}
function unsubscribe(p){
  pods=pods.filter(x=>x.id!==p.id);savePods();
  for(const e of podEps(p.id)){dlDelete(e.k);eps.delete(e.k);}
  try{localStorage.removeItem('mp_pe_'+p.id);}catch(e){}
  plist=plist.filter(k=>!k.startsWith(p.id+'.'));store.set('plist',plist);
  pcRenderHome();
}
async function refreshPod(p){
  const {p:n,list}=await loadFeed(p.url);
  Object.assign(p,{title:n.title,author:n.author,art:n.art||p.art,desc:n.desc,upd:Date.now()});
  store.set('pe_'+p.id,list);indexEps(p,list);
}
let refreshing=false;
async function refreshAll(force){
  if(refreshing||!pods.length)return;
  const due=pods.filter(p=>force||Date.now()-(p.upd||0)>90*6e4);
  if(!due.length)return;
  refreshing=true;
  let i=0;const work=async()=>{while(i<due.length){const p=due[i++];try{await refreshPod(p);}catch(e){}}};
  await Promise.all([work(),work(),work()]);
  savePods();refreshing=false;pcRenderHome();dlAuto();
  if(force)toast('Podcasts aktualisiert');
}

/* Status einer Folge */
const stOf=k=>pst[k]||{};
const isDone=k=>!!stOf(k).x;
function epMeta(e){
  const s=stOf(e.k),parts=[fmtDate(e.d)];
  const dur=(s.d||e.s*1000)||0;
  if(s.x)parts.push('✓ gehört');
  else if(s.p>15000&&dur)parts.push('noch '+fmtMin((dur-s.p)/1000));
  else if(e.s)parts.push(fmtMin(e.s));
  return parts.filter(Boolean).join(' · ');
}
function epRow(e,o={}){
  const p=podById.get(e.pid)||{},s=stOf(e.k),dur=(s.d||e.s*1000)||0;
  const cur=String(S.id)==='p:'+e.k,playing=cur&&S.playing;
  const prog=!s.x&&s.p>15000&&dur?`<span class="bar"><i style="width:${Math.min(100,s.p/dur*100)}%"></i></span>`:'';
  const inList=plist.includes(e.k);
  return `<div class="ep${s.x?' done':''}${cur?' cur':''}" data-ep="${e.k}">
    ${o.thumb!==false?`<div class="th" style="background-image:url('${esc(e.i||p.art||'')}')"></div>`:''}
    <div class="tx">${o.pn!==false?`<div class="pn">${esc(p.title||'')}</div>`:''}<div class="n">${esc(e.t)}</div>
      <div class="m">${prog}<span>${esc(epMeta(e))}</span>${dlBadge(e.k)}${inList&&!o.order?'<span class="q">• Liste</span>':''}</div></div>
    ${o.order?`<div class="ord"><button data-up="${e.k}"><svg class="i" style="width:20px"><use href="#i-up"/></svg></button><button data-down="${e.k}"><svg class="i" style="width:20px"><use href="#i-down"/></svg></button></div>`:''}
    <div class="eb"><button class="pp" data-play="${e.k}"><svg class="i"><use href="#${playing?'i-pause':'i-play'}"/></svg></button><button class="more" data-emenu="${e.k}"><svg class="i" style="width:18px"><use href="#i-more"/></svg></button></div></div>`;
}

}

/* Abspielen: gewählte Folge, danach "Meine Liste" */
function epTrack(e){const p=podById.get(e.pid)||{};return{key:'p:'+e.k,uri:pdl[e.k]?'file://'+pdl[e.k].p:e.u,title:e.t,artist:p.title||'',album:p.title||'',art:e.i||p.art||''};}
async function playEp(k,ctx){
  const e=eps.get(k);if(!e)return;
  let keys;
  if(ctx==='list'){const i=plist.indexOf(k);keys=plist.slice(i);}
  else keys=[k,...plist.filter(x=>x!==k&&!isDone(x))];
  const list=keys.map(x=>eps.get(x)).filter(Boolean);
  const s=stOf(k);
  if(s.x){s.x=false;s.p=0;savePst();}
  store.set('lastMode','pod');
  try{onState(await Music.play({tracks:list.map(epTrack),index:0,shuffle:false,start:s.p>5000?s.p-3000:0,speed:pcSpeed}));}
  catch(err){toast('Abspielen fehlgeschlagen');}
}
function curEp(){const id=String(S.id||'');return id.startsWith('p:')?eps.get(id.slice(2)):null;}

/* Fortschritt laufend merken; fertig gehörte Folgen fliegen aus "Meine Liste" */
let pstSaved=0,lastEpKey='';
function pcTrack(){
  const e=curEp();if(!e)return;
  let pos=S.pos||0;if(S.playing)pos+=Date.now()-lastPosAt;
  const dur=S.dur||e.s*1000;
  const s=pst[e.k]||(pst[e.k]={});
  s.p=pos;if(dur)s.d=dur;s.t=Date.now();
  if((dur&&pos>dur-25000&&dur>60000)||S.ended){s.x=true;s.p=0;
    if(plist.includes(e.k)){plist=plist.filter(x=>x!==e.k);store.set('plist',plist);}}
  if(Date.now()-pstSaved>5000||e.k!==lastEpKey||!S.playing){savePst();pstSaved=Date.now();}
  if(e.k!==lastEpKey&&lastEpKey){const prev=pst[lastEpKey];if(prev&&prev.d&&prev.p>prev.d-60000){prev.x=true;prev.p=0;plist=plist.filter(x=>x!==lastEpKey);store.set('plist',plist);savePst();}}
  lastEpKey=e.k;
}
setInterval(()=>{if(S.playing&&!document.hidden){pcTrack();pcMini();}},1000);

/* Meine Liste */
function addToList(k,next){plist=plist.filter(x=>x!==k);if(next)plist.unshift(k);else plist.push(k);store.set('plist',plist);toast(next?'Kommt als Nächstes':'Zu „Meine Liste“ hinzugefügt');pcRefreshViews();}
function moveInList(k,d){const i=plist.indexOf(k),j=i+d;if(i<0||j<0||j>=plist.length)return;[plist[i],plist[j]]=[plist[j],plist[i]];store.set('plist',plist);pcRefreshViews();}
function openList(){
  openView('Meine Liste',(b,v)=>{
    const draw=()=>{const l=plist.map(k=>eps.get(k)).filter(Boolean);
      b.innerHTML=l.length?`<div class="acts"><button class="pri" data-go="all"><svg class="i" style="fill:currentColor;stroke:none"><use href="#i-play"/></svg>Alles abspielen</button><button data-go="dlall"><svg class="i"><use href="#i-dl"/></svg>Alle laden</button><button data-go="clear" style="flex:.5"><svg class="i"><use href="#i-trash"/></svg></button></div>
        <div class="s" style="color:var(--mute);font-size:13px;margin:4px 0">${l.length} ${l.length===1?'Folge':'Folgen'} · ${fmtMin(l.reduce((s,e)=>s+Math.max(0,(stOf(e.k).d||e.s*1000)-(stOf(e.k).p||0))/1000,0))} · Reihenfolge mit den Pfeilen ändern</div>${l.map(e=>epRow(e,{order:true})).join('')}`
        :`<div class="hint">Noch leer.<br>Über ⋮ bei einer Folge kannst du sie hier einreihen und dir so dein eigenes Programm zusammenstellen.</div>`;};
    v._draw=draw;draw();
    b.onclick=e=>{const g=e.target.closest('[data-go]');
      if(g){if(g.dataset.go==='all'&&plist.length){playEp(plist[0],'list');}else if(g.dataset.go==='dlall'){const n=plist.filter(k=>!isDl(k));n.forEach(k=>dlStart(k,true));toast(n.length?n.length+' Folgen werden geladen':'Alles schon offline');draw();}else if(g.dataset.go==='clear'&&confirm('„Meine Liste“ leeren?')){plist=[];store.set('plist',plist);draw();}return;}
      epClick(e,'list');};
  });
}

/* Menü einer Folge */
function epMenu(e){
  if(!e)return;const inL=plist.includes(e.k),done=isDone(e.k);
  menu(e.t,[
    ['i-queue','Als Nächstes abspielen',()=>addToList(e.k,true)],
    inL?['i-x','Aus „Meine Liste“ entfernen',()=>{plist=plist.filter(x=>x!==e.k);store.set('plist',plist);pcRefreshViews();}]:['i-plus','Zu „Meine Liste“',()=>addToList(e.k,false)],
    done?['i-rew','Als ungehört markieren',()=>{delete pst[e.k];savePst();pcRefreshViews();}]:['i-check','Als gehört markieren',()=>{pst[e.k]={x:true,t:Date.now()};savePst();plist=plist.filter(x=>x!==e.k);store.set('plist',plist);pcRefreshViews();}],
    dlProg.has(e.k)?['i-x','Download abbrechen',()=>dlCancel(e.k)]:isDl(e.k)?['i-trash','Download löschen',()=>{dlDelete(e.k);pcRefreshViews();},'del']:['i-dl','Herunterladen',()=>dlStart(e.k)],

    ['i-mic','Zum Podcast',()=>openPodcast(e.pid)]]);

/* Einzelne Folge mit Beschreibung */
function openEpisode(k){
  const e=eps.get(k);if(!e)return;const p=podById.get(e.pid)||{};
  openView(p.title||'Folge',(b,v)=>{
    const draw=()=>{const cur=String(S.id)==='p:'+k;
      b.innerHTML=`<div class="phero"><div class="big" style="background-image:url('${esc(e.i||p.art||'')}')"></div><div><h2>${esc(e.t)}</h2><div class="s">${esc(epMeta(e))}</div></div></div>
      <div class="acts"><button class="pri" data-go="play"><svg class="i" style="fill:currentColor;stroke:none"><use href="#${cur&&S.playing?'i-pause':'i-play'}"/></svg>${cur&&S.playing?'Pause':stOf(k).p>15000&&!isDone(k)?'Weiterhören':'Abspielen'}</button><button data-go="list"><svg class="i"><use href="#${plist.includes(k)?'i-check':'i-plus'}"/></svg>Liste</button><button data-go="dl"><svg class="i"><use href="#${isDl(k)?'i-check':'i-dl'}"/></svg>${dlProg.has(k)?'<span data-dlk="'+k+'">…</span>':isDl(k)?'Offline':'Laden'}</button></div>
      <div class="pdesc" style="margin-top:10px">${esc(e.x||'Keine Beschreibung.')}</div>`;};
    v._draw=draw;draw();
    b.onclick=ev=>{const g=ev.target.closest('[data-go]');if(!g)return;
      if(g.dataset.go==='play'){if(String(S.id)==='p:'+k)ctl('toggle');else playEp(k);}
      else if(g.dataset.go==='dl'){if(dlProg.has(k))dlCancel(k);else if(isDl(k)){if(confirm('Download löschen?')){dlDelete(k);pcRefreshViews();}}else{dlStart(k);draw();}}
      else{if(plist.includes(k)){plist=plist.filter(x=>x!==k);store.set('plist',plist);pcRefreshViews();}else addToList(k,false);}};
  });
}

/* Podcast-Seite: Abo, Ordner, Folgen mit Filter */
function openPodcast(id,preview){
  let p=podById.get(id)||preview&&preview.p;if(!p)return;
  let list=podById.has(id)?podEps(id):(preview?preview.list:[]);
  if(!podById.has(id))indexEps(p,list);
  let filter='alle',asc=false,shown=60;
  const v=openView(p.title,(b,v)=>{
    const draw=()=>{const sub=podById.has(p.id);
      let l=list.slice();if(asc)l.reverse();
      if(filter==='neu')l=l.filter(e=>!isDone(e.k));
      if(filter==='begonnen')l=l.filter(e=>!isDone(e.k)&&stOf(e.k).p>15000);
      b.innerHTML=`<div class="phero"><div class="big" style="background-image:url('${esc(p.art||'')}')"></div><div style="min-width:0"><h2>${esc(p.title)}</h2><div class="s">${esc(p.author||'')}</div>
        <div class="s" style="margin-top:4px">${list.length} Folgen${sub&&p.cat?' · 📁 '+esc(p.cat):''}</div>
        <button class="subbtn${sub?' on':''}" data-go="sub">${sub?'✓ Abonniert':'＋ Abonnieren'}</button></div></div>
        ${p.desc?`<div class="pdesc clamp" data-go="desc">${esc(p.desc)}</div>`:''}
        <div class="chips" style="margin-top:12px">${[['alle','Alle'],['neu','Ungehört'],['begonnen','Begonnen']].map(([k,t])=>`<button data-f="${k}" class="${filter===k?'on':''}">${t}</button>`).join('')}<button data-go="sort">${asc?'Älteste zuerst':'Neueste zuerst'} ⇅</button></div>
        ${l.slice(0,shown).map(e=>epRow(e,{pn:false,thumb:false})).join('')||'<div class="hint">Keine Folgen.</div>'}
        ${l.length>shown?`<div class="acts"><button data-go="more">Weitere Folgen (${l.length-shown})</button></div>`:''}`;};
    v._draw=draw;draw();
    b.onclick=async e=>{
      const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;draw();return;}
      const g=e.target.closest('[data-go]');
      if(g){const a=g.dataset.go;
        if(a==='sort'){asc=!asc;draw();}
        else if(a==='more'){shown+=100;draw();}
        else if(a==='desc'){g.classList.toggle('clamp');}
        else if(a==='sub'){
          if(podById.has(p.id))podMenu(p,v);
          else{try{p=await subscribe(p.url);list=podEps(p.id);draw();}catch(err){toast('Abonnieren fehlgeschlagen');}}}
        return;}
      epClick(e,'pod');
    };
  });
  const ex=v.querySelector('.ex');ex.innerHTML=`<button class="ibtn"><svg class="i"><use href="#i-more"/></svg></button>`;
  ex.firstChild.onclick=()=>{if(podById.has(p.id))podMenu(p,v);else toast('Erst abonnieren');};
}
function podMenu(p,v){
  menu(p.title,[
    ['i-folder','In Ordner einsortieren…',()=>setTimeout(()=>catMenu(p,v),260)],
    [p.auto?'i-check':'i-dl',p.auto?'Automatisch laden: AN (im WLAN)':'Neue Folgen automatisch laden (WLAN)',()=>{p.auto=!p.auto;if(p.auto)p.autoSince=Date.now();savePods();toast(p.auto?'Die 2 neuesten Folgen werden im WLAN automatisch geladen':'Automatisch laden aus');if(p.auto)dlAuto();}],

    ['i-check','Alle als gehört markieren',()=>{for(const e of podEps(p.id))pst[e.k]={x:true,t:Date.now()};savePst();v._draw&&v._draw();pcRenderHome();}],
    ['i-link','Feed-Adresse anzeigen',()=>prompt('RSS-Adresse',p.url)],

/* Podcast finden: Verzeichnis-Suche, RSS-Adresse, OPML, Beliebt */

function openAdd(q){
  openView('Podcast hinzufügen',async b=>{

      <div class="inp"><input id="aq" type="search" placeholder="Name, Thema oder Person" value="${esc(q||'')}"><button class="pri" id="aGo">Suchen</button></div>
