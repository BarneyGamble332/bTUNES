/* Bildschirmpunkt <-> Stelle auf einer Seite (in PDF-Punkten) */
function zHit(cx,cy){
  const C=$('#zPages'),R=C.getBoundingClientRect();
  const x=C.scrollLeft+cx-R.left,y=C.scrollTop+cy-R.top;
  for(let i=0;i<Z.rect.length;i++){const r=Z.rect[i];if(y>=r.y-6&&y<=r.y+r.h+6)return{i,x:(x-r.x)/r.s,y:(y-r.y)/r.s,inside:x>=r.x&&x<=r.x+r.w};}
  return null;
}
/* Zoom setzen; die Stelle (Seite i, Punkt px/py) bleibt am Bildschirmpunkt sx/sy */
function zZoomTo(zf,i,px,py,sx,sy,smooth){
  zf=Math.max(Z.minZ,Math.min(Z.maxZ,zf));
  Z.zf=zf;zLayout();
  const C=$('#zPages'),r=Z.rect[i];
  const l=r.x+px*r.s-sx,t=r.y+py*r.s-sy;
  if(smooth)C.scrollTo({left:l,top:t,behavior:'smooth'});else{C.scrollLeft=l;C.scrollTop=t;}
  zOnScroll();zBar();
}
function zGoPage(i,smooth){
  i=Math.max(0,Math.min(Z.n-1,i));
  const C=$('#zPages'),r=Z.rect[i];
  const top=r.y-(Z.zf>1.05?0:6);
  C.scrollTo({top,left:Z.zf>1.05?C.scrollLeft:0,behavior:smooth?'smooth':'auto'});
  Z.page=i;zBar();zOnScroll();
}
/* Gesten: zwei Finger = Zoom, Doppeltipp = Spalte, Tipp = Artikel wählen */
function zGestures(C){
  const I=$('#zIn');let pin=null;
  const two=e=>{const a=e.touches[0],b=e.touches[1];return{d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};};
  C.addEventListener('touchstart',e=>{
    if(e.touches.length!==2)return;e.preventDefault();
    const t=two(e),h=zHit(t.x,t.y);if(!h)return;
    const R=C.getBoundingClientRect();
    pin={d0:t.d,x0:t.x,y0:t.y,h,s:1,x:t.x,y:t.y,ox:C.scrollLeft+t.x-R.left,oy:C.scrollTop+t.y-R.top};
    I.style.transformOrigin=pin.ox+'px '+pin.oy+'px';tapS=null;
  },{passive:false});
  C.addEventListener('touchmove',e=>{
    if(!pin||e.touches.length<2)return;if(e.cancelable)e.preventDefault();
    const t=two(e);const zf=Math.max(Z.minZ,Math.min(Z.maxZ,Z.zf*t.d/pin.d0));
    pin.s=zf/Z.zf;pin.x=t.x;pin.y=t.y;
    I.style.transform=`translate(${t.x-pin.x0}px,${t.y-pin.y0}px) scale(${pin.s})`;
  },{passive:false});
  const tend=e=>{if(!pin||e.touches.length>=2)return;const p=pin;pin=null;I.style.transform='';
    const R=C.getBoundingClientRect();Z.col=null;zZoomTo(Z.zf*p.s,p.h.i,p.h.x,p.h.y,p.x-R.left,p.y-R.top);};
  C.addEventListener('touchend',tend);C.addEventListener('touchcancel',tend);
  // Tippen erkennen (Finger und Maus)
  let tapS=null,last=null,tapT=null,drag=null;
  C.addEventListener('pointerdown',e=>{
    tapS={x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId};
    if(e.pointerType==='mouse'&&e.button===0&&Z.zf>1.02){drag={x:e.clientX,y:e.clientY,l:C.scrollLeft,t:C.scrollTop};}
  });
  C.addEventListener('pointermove',e=>{
    if(tapS&&Math.hypot(e.clientX-tapS.x,e.clientY-tapS.y)>10)tapS=null;
    if(drag&&(e.buttons&1)){C.scrollLeft=drag.l-(e.clientX-drag.x);C.scrollTop=drag.t-(e.clientY-drag.y);C.classList.add('drag');}
  });
  C.addEventListener('pointerup',e=>{
    drag=null;C.classList.remove('drag');
    if(!tapS||pin||tapS.id!==e.pointerId||Date.now()-tapS.t>400){tapS=null;return;}
    const t=tapS;tapS=null;
    if(last&&Date.now()-last.t<330&&Math.hypot(t.x-last.x,t.y-last.y)<40){clearTimeout(tapT);last=null;zDoubleTap(t.x,t.y);}
    else{last={x:t.x,y:t.y,t:Date.now()};clearTimeout(tapT);tapT=setTimeout(()=>{last=null;zTap(t.x,t.y);},300);}
  });
  C.addEventListener('pointercancel',()=>{tapS=null;drag=null;});
  C.addEventListener('wheel',e=>{
    if(!e.ctrlKey)return;e.preventDefault();
    const R=C.getBoundingClientRect(),h=zHit(e.clientX,e.clientY);if(!h)return;
    Z.col=null;zZoomTo(Z.zf*Math.exp(-e.deltaY*0.0025),h.i,h.x,h.y,e.clientX-R.left,e.clientY-R.top);
  },{passive:false});
}
/* Artikel / Spalte an einer Stelle der Seite */
function zFindAt(segs,x,y){
  for(let ai=0;ai<segs.length;ai++){const a=segs[ai];
    for(let ci=0;ci<a.cols.length;ci++){const c=a.cols[ci];if(x>=c[0]-6&&x<=c[2]+6&&y>=c[1]-8&&y<=c[3]+8)return{ai,ci};}}
  let best=null;
  for(let ai=0;ai<segs.length;ai++){const a=segs[ai];
    for(let ci=0;ci<a.cols.length;ci++){const c=a.cols[ci];const dx=Math.max(c[0]-x,0,x-c[2]),dy=Math.max(c[1]-y,0,y-c[3]);const d=Math.hypot(dx,dy);if(d<40&&(!best||d<best.d))best={ai,ci,d};}
    const b=a.box;if(!best&&x>=b[0]&&x<=b[2]&&y>=b[1]&&y<=b[3])best={ai,ci:-1,d:99};}
  return best;
}
async function zTap(cx,cy){
  if(!Z||Z.mode!=='page')return;
  const h=zHit(cx,cy);if(!h||!h.inside){zSelect(null);return;}
  if(Z.col){return;}
  const segs=await zSegOf(h.i);const f=zFindAt(segs,h.x,h.y);
  if(!f){zSelect(null);return;}
  if(Z.sel&&Z.sel.p===h.i&&Z.sel.i===f.ai){zShowArticle(h.i,f.ai);return;}
  zSelect({p:h.i,i:f.ai,box:segs[f.ai].box,title:segs[f.ai].title||zFirstWords(segs[f.ai])});
}
async function zDoubleTap(cx,cy){
  if(!Z||Z.mode!=='page')return;
  const C=$('#zPages'),R=C.getBoundingClientRect();
  const h=zHit(cx,cy);if(!h)return;
  if(Z.zf>1.25){const r=Z.rect[h.i];Z.col=null;zSelect(null);zZoomTo(1,h.i,h.x,h.y,cx-R.left,cy-R.top);return;}
  const segs=await zSegOf(h.i);const f=zFindAt(segs,h.x,h.y);
  if(f&&f.ci>=0){zColumn(h.i,f.ai,f.ci,cy-R.top,h.y);return;}
  zZoomTo(2.5,h.i,h.x,h.y,cx-R.left,cy-R.top);
}
/* Spaltenmodus: Spalte füllt die Breite, Pfeile springen zur nächsten Spalte */
async function zColumn(p,ai,ci,sy,py){
  const segs=await zSegOf(p);const a=segs[ai];if(!a)return;const c=a.cols[ci];
  const C=$('#zPages');const W=C.clientWidth;
  const colW=c[2]-c[0]+10;
  const pgW=Z.pages[p].w;
  // Handy: Spalte füllt die Breite. Großer Bildschirm: höchstens ~2,3 Bildpunkte je Punkt (angenehme Lesegröße), mittig
  const s=Math.min((W-12)/colW,2.3);
  const zf=s*pgW/Z.fitW;
  Z.col={p,ai,ci};zSelect(null,true);
  zZoomTo(zf,p,c[0]-5,py!=null?py:c[1]-6,Math.max(6,(W-colW*s)/2),sy!=null?sy:8,py==null);
}
function zColStep(d){
  if(!Z||!Z.col)return;const {p,ai,ci}=Z.col;
  zSegOf(p).then(segs=>{const a=segs[ai];const n=ci+d;
    if(n>=0&&n<a.cols.length){zColumn(p,ai,n);return;}
    toast(d>0?'Ende des Artikels':'Anfang des Artikels');});
}
function zSelect(sel,keep){
  Z.sel=sel;
  document.querySelectorAll('.zhl').forEach(x=>x.remove());
  if(sel)zHighlight(sel.p,sel.box);
  if(!keep)Z.col=null;
  zBar();
}
function zHighlight(p,box){
  const pe=Z.pe[p],r=Z.rect[p];if(!pe)return;
  document.querySelectorAll('.zhl').forEach(x=>x.remove());
  const d=document.createElement('div');d.className='zhl';
  Object.assign(d.style,{left:(box[0]*r.s-4)+'px',top:(box[1]*r.s-4)+'px',width:((box[2]-box[0])*r.s+8)+'px',height:((box[3]-box[1])*r.s+8)+'px'});
  pe.el.appendChild(d);
}
function zFirstWords(a){const t=(a.paras[0]?a.paras[0].runs.map(r=>r.t).join(''):'').split(/\s+/).slice(0,7).join(' ');return t?t+' …':'Text';}

/* Leiste unten */
function zBar(){
  const B=$('#zBar');if(!B||!Z)return;
  const ico=(n,f)=>`<svg class="i"${f?' style="fill:currentColor;stroke:none"':''}><use href="#${n}"/></svg>`;
  if(Z.mode==='read'){
    const all=zArtList(),k=Z.cur?all.findIndex(e=>e.p===Z.cur[0]&&e.i===Z.cur[1]):-1;
    B.innerHTML=`<button data-b="prev" aria-label="Voriger Artikel">${ico('i-back')}</button><button data-b="smaller" aria-label="Schrift kleiner">A−</button><span class="lbl">${k>=0?(k+1)+' / '+all.length+(Z.idxDone?'':'…'):''}</span><button data-b="bigger" aria-label="Schrift größer">A+</button><button data-b="theme" aria-label="Hell/Dunkel">${ico('i-moon')}</button><button data-b="next" aria-label="Nächster Artikel" style="transform:scaleX(-1)">${ico('i-back')}</button>`;
  }else if(Z.col){
    B.innerHTML=`<button data-b="cprev">${ico('i-back')}Spalte</button><button class="pri" data-b="readcol">Lesen</button><button data-b="cnext">Spalte<span style="transform:scaleX(-1);display:flex">${ico('i-back')}</span></button><button data-b="cx" aria-label="Zurück zur Seite">${ico('i-x')}</button>`;
  }else if(Z.sel){
    B.innerHTML=`<button class="pri" data-b="read">Lesen: ${esc(Z.sel.title)}</button><button data-b="cx" aria-label="Auswahl aufheben">${ico('i-x')}</button>`;
  }else{
    B.innerHTML=`<button data-b="pprev" aria-label="Vorige Seite">${ico('i-up')}</button><span class="lbl">Seite ${Z.page+1} / ${Z.n}</span><button data-b="pnext" aria-label="Nächste Seite">${ico('i-down')}</button>${Z.zf>1.05?`<button data-b="fit" aria-label="Ganze Seite">${ico('i-x')}</button>`:''}`;
  }
  const head=Z.v.querySelector('.zmode');if(head)head.textContent=Z.mode==='page'?'Lesen':'Seite';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('#zBar [data-b]');if(!b||!Z)return;const a=b.dataset.b;
  if(a==='pprev')zGoPage(Z.page-1,true);
  else if(a==='pnext')zGoPage(Z.page+1,true);
  else if(a==='fit'){const C=$('#zPages'),R=C.getBoundingClientRect();const h=zHit(R.left+C.clientWidth/2,R.top+C.clientHeight/2);Z.col=null;if(h)zZoomTo(1,h.i,h.x,h.y,C.clientWidth/2,C.clientHeight/2);else{Z.zf=1;zLayout();}}
  else if(a==='read'&&Z.sel)zShowArticle(Z.sel.p,Z.sel.i);
  else if(a==='readcol'&&Z.col)zShowArticle(Z.col.p,Z.col.ai);
  else if(a==='cprev')zColStep(-1);else if(a==='cnext')zColStep(1);
  else if(a==='cx'){if(Z.col){const C=$('#zPages'),R=C.getBoundingClientRect();const h=zHit(R.left+8,R.top+C.clientHeight/2);Z.col=null;if(h)zZoomTo(1,h.i,h.x,h.y,8,C.clientHeight/2);}zSelect(null);}
  else if(a==='prev')zStep(-1);else if(a==='next')zStep(1);
  else if(a==='smaller'||a==='bigger'){ztPrefs.fs=Math.max(14,Math.min(30,ztPrefs.fs+(a==='bigger'?1:-1)));store.set('ztprefs',ztPrefs);zApplyPrefs();}
  else if(a==='theme'){ztPrefs.th=ztPrefs.th==='dark'?'light':'dark';store.set('ztprefs',ztPrefs);zApplyPrefs();}
});

/* ---------- Artikel-Erkennung je Seite ---------- */
function zSegOf(i,fonts){
  const m=fonts?Z.segF:Z.seg;
  if(!m.has(i))m.set(i,(async()=>{
    const page=await Z.doc.getPage(i+1);const vb=page.view;
    const tc=await page.getTextContent();
    let fn=null;
    if(fonts){await page.getOperatorList();fn=k=>{try{return page.commonObjs.get(k).name||'';}catch(e){return '';}};}
    const items=tc.items.map(it=>it.transform?{str:it.str,width:it.width,fontName:it.fontName,transform:[it.transform[0],it.transform[1],it.transform[2],it.transform[3],it.transform[4]-vb[0],it.transform[5]-vb[1]]}:it);
    return zSegment(items,vb[2]-vb[0],vb[3]-vb[1],fn,tc.styles);
  })().catch(()=>[]));
  return m.get(i);
}
const zText=a=>a.paras.map(p=>p.runs.map(r=>r.t).join('')).join('\n');
function zEntries(p,segs){const mag=Z.pages[p]&&Z.pages[0]&&Z.pages[p].w<Z.pages[0].w*0.8;
  return segs.map((a,i)=>({p,i,t:a.title||zFirstWords(a),k:a.kicker,n:a.intro.slice(0,240),r:a.ressort,w:a.words,o:!a.title,ad:a.adPage,f:a.fonts||[],mag,x:(a.title+' '+a.intro+' '+zText(a)).slice(0,30000)}));}
async function zPageIdx(p){if(!Z.idx[p])Z.idx[p]=zEntries(p,await zSegOf(p));return Z.idx[p];}
function zEntry(p,i){return Z.idx[p]&&Z.idx[p][i]||null;}
/* Artikel, die als eigener Eintrag zählen (ohne Anzeigenreste) */
const zReal=e=>e.w>=60||(e.n&&!e.o);
/* Hausschrift der Ausgabe = Schrift mit dem meisten Text; Anzeigen nutzen meist andere Schriften */
function zFam(idx){const t={};for(const l of idx)if(l)for(const e of l)for(const [fp,c] of e.f||[])t[fp]=(t[fp]||0)+c;
  const top=Object.keys(t).sort((a,b)=>t[b]-t[a])[0];return top?top.split('|'):null;}
const Z_SKIP=/^(STELLENMARKT|KENNENLERNEN|INHALT|ANZEIGE|SCHACH|SUDOKU|RÄTSEL|IMPRESSUM)/i;
/* Nur Hauptartikel: mit Titel, genug Text, überwiegend in der Hausschrift, keine Anzeigen-/Stellenseiten */
function zMain(e,fam){
  if(e.o||e.ad||e.w<200||Z_SKIP.test(e.r||''))return false;
  if(/^LESERBRIEFE/i.test(e.r||'')&&e.w<600)return false;
  if(fam&&e.f&&e.f.length){let all=0,own=0;for(const [fp,c] of e.f){all+=c;const [f,a]=fp.split('|');if(f===fam[0]&&Math.abs(+a-+fam[1])<0.025)own+=c;}if(all&&own/all<0.6)return false;}
  return true;
}
function zArtList(idx){idx=idx||Z.idx;const fam=zFam(idx),out=[];for(const l of idx)if(l)for(const e of l)if(zMain(e,fam))out.push(e);return out;}
async function zBuildIndex(){
  const myZ=Z,ck='zi:'+ZV+':'+Z.key;
  const cached=await idb.get(ck);
  if(Z!==myZ)return;
  if(cached&&cached.length===Z.n){Z.idx=cached;Z.idxDone=true;ztIdxMem.set(Z.key,Z.idx);zBar();zTocDraw();return;}
  for(let p=0;p<Z.n;p++){
    if(Z!==myZ)return;
    await zPageIdx(p);
    if(p%10===9){zTocDraw();zBar();}
  }
  Z.idxDone=true;idb.set(ck,Z.idx);ztIdxMem.set(Z.key,Z.idx);zTocDraw();zBar();
}

/* ---------- Lesemodus ---------- */
function zSetMode(m){
  if(!Z)return;
  if(m==='read'){
    if(Z.sel){zShowArticle(Z.sel.p,Z.sel.i);return;}
    if(Z.col){zShowArticle(Z.col.p,Z.col.ai);return;}
    // erster richtiger Artikel ab der aktuellen Seite
    (async()=>{for(let p=Z.page;p<Z.n;p++){const l=await zPageIdx(p);const fam=zFam(Z.idx);const e=l.find(x=>zMain(x,fam))||l.find(zReal);if(e){zShowArticle(e.p,e.i);return;}}toast('Kein Artikel gefunden');})();
    return;}
  Z.mode='page';$('#zRead').classList.add('hidden');$('#zPages').classList.remove('hidden');
  if(Z.cur){const [p,i]=Z.cur;zGoPage(p,false);zSegOf(p).then(segs=>{const a=segs[i];if(a&&Z.mode==='page'){zSelect({p,i,box:a.box,title:a.title||zFirstWords(a)});
    const C=$('#zPages'),r=Z.rect[p];C.scrollTop=Math.max(0,r.y+a.box[1]*r.s-60);}});}
  zBar();zSavePos();
}
function zApplyPrefs(){const R=$('#zRead');if(!R)return;R.style.setProperty('--zfs',ztPrefs.fs+'px');R.classList.toggle('light',ztPrefs.th==='light');}
const zRuns=runs=>runs.map(r=>{let t=esc(r.t);if(r.i)t='<i>'+t+'</i>';if(r.b)t='<b>'+t+'</b>';return t;}).join('');
async function zShowArticle(p,i){
  if(!Z)return;
  Z.mode='read';Z.cur=[p,i];Z.sel=null;Z.col=null;
  const R=$('#zRead');R.classList.remove('hidden');$('#zPages').classList.add('hidden');zApplyPrefs();
  zBar();
  const myZ=Z;
  if(!R.firstChild)R.innerHTML='<div class="spin" style="margin-top:80px"></div>';
  const segs=await zSegOf(p,true);
  await zPageIdx(p);
  if(Z!==myZ||!Z.cur||Z.cur[0]!==p||Z.cur[1]!==i)return;
  const plain=await zSegOf(p);
  // gleiche Reihenfolge in beiden Durchläufen; zur Sicherheit über die Position zuordnen
  const ref=plain[i];const a=segs.find(x=>ref&&x.box.join()===ref.box.join())||segs[i];
  if(!a){R.innerHTML='<div class="hint">Artikel nicht gefunden.</div>';return;}
  const min=Math.max(1,Math.round(a.words/220));
  const all=zArtList(),k=all.findIndex(e=>e.p===p&&e.i===i),nx=all[k+1];
  const title=a.title||'Fortsetzung';
  R.innerHTML=`<article class="zart" lang="de">
    <div class="zres">${esc([a.ressort||(p===0?'Titelseite':''),'Seite '+(p+1)].filter(Boolean).join(' · '))}</div>
    ${a.kicker?`<div class="zk">${esc(a.kicker)}</div>`:''}
    <h1>${esc(title)}</h1>
    ${a.intro?`<p class="zi">${esc(a.intro)}</p>`:''}
    <div class="zm">${a.by?`<span class="zby">${esc(a.by)}</span> · `:''}${min} Min. Lesezeit</div>
    ${a.paras.map(q=>q.k==='h'?`<h3>${zRuns(q.runs)}</h3>`:`<p>${zRuns(q.runs)}</p>`).join('')}
    ${(a.boxes||[]).map(b=>`<aside class="zbox"><h4>${esc(b.title)}</h4>${b.paras.map(q=>`<p>${zRuns(q.runs)}</p>`).join('')}</aside>`).join('')}
    ${a.caps.length?`<div class="zcaps">${a.caps.map(c=>`<div class="zcap">${esc(c)}</div>`).join('')}</div>`:''}
    <div class="zacts"><button data-r="page"><svg class="i"><use href="#i-paper"/></svg>Original-Seite</button><button data-r="toc"><svg class="i"><use href="#i-list"/></svg>Inhalt</button></div>
    ${nx?`<button class="znext" data-r="next"><span>Nächster Artikel · Seite ${nx.p+1}</span><b>${esc(nx.t)}</b></button>`:''}
    <div class="zsrc">Lesemodus: Text automatisch aus dem PDF übernommen – bei ungewöhnlichem Layout hilft die Original-Seite.</div>
  </article>`;
  R.scrollTop=0;
  R.onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;const r=b.dataset.r;if(r==='page')zSetMode('page');else if(r==='toc')zOpenToc();else if(r==='next')zStep(1);};
  zBar();zSavePos();
}
async function zStep(d){
  if(!Z||!Z.cur)return;const [p,i]=Z.cur;
  for(let q=p;q>=0&&q<Z.n;q+=d){
    await zPageIdx(q);const fam=zFam(Z.idx);
    let l=Z.idx[q].filter(e=>zMain(e,fam)&&(q!==p||(d>0?e.i>i:e.i<i)));
    if(l.length){const e=d>0?l[0]:l[l.length-1];zShowArticle(e.p,e.i);return;}
  }
  toast(d>0?'Das war der letzte Artikel':'Das ist der erste Artikel');
}

/* ---------- Inhaltsverzeichnis ---------- */
let zTocV=null;
function zOpenToc(){
  if(!Z)return;
  zTocV=openView('Inhalt',(b,v)=>{
    b.innerHTML=`<label class="search" style="margin:4px 0 8px"><svg class="i" style="width:20px;height:20px"><use href="#i-search"/></svg><input id="zTocQ" type="search" placeholder="In dieser Ausgabe suchen" autocomplete="off"></label><div id="zTocL"></div>`;
    b.querySelector('#zTocQ').oninput=()=>zTocDraw();
    b.onclick=e=>{
      const pg=e.target.closest('[data-zp]');if(pg){e.stopPropagation();const p=+pg.dataset.zp;back();zSetMode('page');Z.cur=null;zGoPage(p,false);return;}
      const r=e.target.closest('[data-za]');if(r){const [p,i]=r.dataset.za.split(':').map(Number);back();zShowArticle(p,i);}};
    v._draw=zTocDraw;
  });
  zTocDraw();
}
function zTocDraw(){
  if(!Z||!zTocV||!document.body.contains(zTocV))return;
  const L=zTocV.querySelector('#zTocL');if(!L)return;
  const q=norm(zTocV.querySelector('#zTocQ').value.trim());
  const done=Z.idx.filter(Boolean).length;

    h+=`<button class="ztoc${cur?' cur':''}" data-za="${e.p}:${e.i}"><span class="pg" data-zp="${e.p}">${e.p+1}</span><div class="tx">${e.k?`<div class="k">${esc(e.k)}</div>`:''}<div class="n">${esc(e.t)}</div>${e.n?`<div class="s">${esc(e.n)}</div>`:''}</div><span class="m">${Math.max(1,Math.round(e.w/220))} Min.</span></button>`;

  if(!n)h+=`<div class="hint">${q?'Nichts gefunden.':'Noch keine Artikel erkannt.'}</div>`;
  L.innerHTML=h;
}

/* ----- Artikel-Erkennung (aus den Textpositionen von pdf.js) ----- */
/* Zeitungsseite in Artikel zerlegen (aus den Textpositionen von pdf.js).
   Ergebnis: [{title, kicker, intro, blocks:[{k:'p'|'h'|'cap', runs:[{t,b,i}]}], box:[x0,y0,x1,y1], cols:[[x0,x1]...]}] */
function zSegment(items, W, H, fontName, styles) {
  const fname = fontName || (() => '');
  // 1) Textstücke: Position (oben links), Größe, Schrift
  const parts = [];
  for (const it of items) {
    const s = (it.str || '').replace(/\uFFFD/g, ' ');
    if (!s.trim()) continue;
    const [a, b, c, d, x, y] = it.transform;
    const fs = Math.hypot(c, d);
    if (fs < 4) continue;
    let px = x, py = H - y;
    if (Math.abs(b) > 0.01 || Math.abs(c) > 0.01 || a <= 0) {
      // gedrehter Text (Fotonachweis) fällt weg – außer ein auf den Kopf gestellter Buchstabe im Schriftzug
      if (!(s.trim().length === 1 && a < 0 && d < 0 && Math.abs(b) < 0.01)) continue;
      px = x - it.width; py = H - y + fs * 0.7;
    }
    const fn = fname(it.fontName) || '';
    const st = styles && styles[it.fontName];
    const fp = st ? st.fontFamily + '|' + (+st.ascent || 0).toFixed(3) + '|' + (+st.descent || 0).toFixed(3) : '';
    parts.push({ fp, s, x: px, x1: px + it.width, y: py, fs, fn, bold: /Bold|SemBol|Black|Heavy/i.test(fn), ital: /Italic|Oblique|Kursiv/i.test(fn) });
  }
  if (!parts.length) return [];
  { const seen = new Map();
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i], l = seen.get(p.s) || [];
      // gleicher Text auf gleicher Höhe, der sich zu mehr als der Hälfte überdeckt = Mehrfachdruck
      if (p.s.trim().length > 2 && l.some(q => Math.abs(q.y - p.y) < 2.5 && Math.min(q.x1, p.x1) - Math.max(q.x, p.x) > (p.x1 - p.x) * 0.5)) parts.splice(i, 1); else { l.push(p); seen.set(p.s, l); }
    } }

  // 2) Grundschrift der Seite = häufigste Größe (nach Zeichen)
  const cnt = {};
  for (const p of parts) { const k = Math.round(p.fs * 2) / 2; cnt[k] = (cnt[k] || 0) + p.s.length; }
  const body = +Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];

  // 3) Initialen (riesiger Einzelbuchstabe) merken und später vor die erste Zeile daneben setzen
  const drops = [];
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if (p.s.trim().length === 1 && /\p{Lu}/u.test(p.s) && p.fs > body * 3.5) { drops.push(p); parts.splice(i, 1); }
  }

  // 4) Zeilen bilden: gleiche Grundlinie und dicht nebeneinander
  parts.sort((a, b) => a.y - b.y || a.x - b.x);
  const lines = [];
  for (const p of parts) {
    let L = null;
    for (let i = lines.length - 1; i >= 0 && i >= lines.length - 40; i--) {
      const l = lines[i];
      if (Math.abs(l.y - p.y) < Math.max(l.fs, p.fs) * 0.35 || (p.fs < l.fs * 0.7 && p.y < l.y && l.y - p.y < l.fs * 0.6)) {
        const gap = p.x > l.x1 ? p.x - l.x1 : (p.x1 < l.x ? l.x - p.x1 : 0);
        if (gap > -Math.max(2, p.fs * 0.2) && gap < Math.min(l.fs, p.fs) * (Math.min(l.fs, p.fs) > 20 ? 0.9 : 0.8)) { L = l; break; }
      }
    }
    if (L) {
      L.ps.push(p); L.x = Math.min(L.x, p.x); L.x1 = Math.max(L.x1, p.x1);
      if (p.s.length > 2 && !(p.fs < L.fs * 0.7 && L.y - p.y > L.fs * 0.2)) L.chars[p.fs] = (L.chars[p.fs] || 0) + p.s.length;
    } else {
      lines.push({ x: p.x, x1: p.x1, y: p.y, fs: p.fs, ps: [p], chars: { [p.fs]: p.s.length } });
    }
  }
  // Blocksatz mit großen Wortabständen (z. B. neben Initialen): Bruchstücke einer Zeile zusammenfügen,
  // außer die Lücke ist ein Spaltenzwischenraum (rechts beginnt eine Spalte, an deren Kante viele Zeilen starten)
  {
    const eL = {}, eR = {};
    for (const l of lines) { if (Math.abs(l.fs - body) > 1) continue; const a = Math.round(l.x), b = Math.round(l.x1); eL[a] = (eL[a] || 0) + 1; eR[b] = (eR[b] || 0) + 1; }
    const near = (m, v) => { for (let d = -2; d <= 2; d++) if ((m[Math.round(v) + d] || 0) >= 4) return true; return false; };
    // übliche Spaltenbreite: zusammengefügte Zeile darf nicht breiter werden
    const wc = {};
    for (const l of lines) if (Math.abs(l.fs - body) <= 1) { const w = Math.round((l.x1 - l.x) / 4) * 4; wc[w] = (wc[w] || 0) + 1; }
    const colW = +Object.keys(wc).sort((a, b) => wc[b] - wc[a])[0] || W;
    lines.sort((a, b) => a.y - b.y || a.x - b.x);
    for (let i = 0; i < lines.length; i++) {
      const A = lines[i];
      for (let j = i + 1; j < lines.length && lines[j].y - A.y < A.fs * 0.35; j++) {
        const B = lines[j];
        if (Math.abs(B.y - A.y) > A.fs * 0.35 || Math.abs(B.fs - A.fs) > 0.5 || Math.abs(A.fs - body) > 1.5) continue;
        const gap = B.x - A.x1;
        if (gap < 0 || gap > A.fs * 2.6) continue;
        if (near(eL, B.x) && (near(eR, A.x1) || gap > A.fs * 1.2)) continue;
        if (B.x1 - A.x > colW + body * 1.5) continue;
        A.ps.push(...B.ps); A.x1 = Math.max(A.x1, B.x1);
        for (const k in B.chars) A.chars[k] = (A.chars[k] || 0) + B.chars[k];
        lines.splice(j, 1); j = i;
      }
    }
  }
  for (const L of lines) {
    L.ps.sort((a, b) => a.x - b.x);
    L.runs = [];
    let prev = null;
    for (const p of L.ps) {
      let t = p.s;
      if (prev) {
        const sup = (p.fs < prev.fs * 0.7 && prev.y - p.y > prev.fs * 0.2) || (prev.fs < p.fs * 0.7 && p.y - prev.y > p.fs * 0.2);   // hochgestelltes o in "N o 48"
        if (p.x - prev.x1 > Math.min(p.fs, prev.fs) * 0.08 && !sup && !/\s$/.test(prev.s) && !/^\s/.test(t)) t = ' ' + t;
      }
      L.runs.push({ t, b: p.bold, i: p.ital, fs: p.fs, x: p.x });
      prev = p;
    }
  }
  for (const l of lines) {
    // Zeilengröße = vorherrschende Größe; fett/kursiv, wenn die ganze Zeile so ist
    l.fs = +Object.keys(l.chars).sort((a, b) => l.chars[b] - l.chars[a])[0] || l.fs;
    l.text = l.runs.map(r => r.t).join('');
    l.bold = l.runs.every(r => r.b || !r.t.trim());
    l.top = l.y - l.fs * 0.8;
  }
  // Initiale an die erste Zeile rechts daneben hängen
  for (const d of drops) {
    const cand = lines.filter(l => l.x > d.x && l.x - d.x1 < body * 3 && l.y > d.y - d.fs && l.y <= d.y + body).sort((a, b) => a.y - b.y)[0];
    if (!cand) { lines.push({ x: d.x, x1: d.x1, y: d.y, fs: d.fs, runs: [{ t: d.s, b: d.bold, i: d.ital, fs: d.fs }], chars: { [d.fs]: 1 }, text: d.s, top: d.y - d.fs * 0.8 }); continue; }
    for (const l of lines) if (l !== cand && l.x > d.x && l.x - d.x1 < body * 3 && l.y > d.y - d.fs && l.y <= d.y + body * 0.5) l.byDrop = true;
    { cand.runs.unshift({ t: d.s.trim(), b: false, i: false, fs: body }); cand.text = d.s.trim() + cand.text; cand.x = Math.min(cand.x, d.x); cand.drop = true; }
  }

  // 5) Kopfzeile (Seitenzahl, Ressort, Datum) und Fußzeile weglassen
  const headBand = H * 0.062, footBand = H * 0.975;
  const isHead = l => l.y < headBand || l.top > footBand;
  const use = lines.filter(l => !isHead(l));

  // 6) Überschriften-Gruppen: große Zeilen, die untereinander stehen
  const big = l => l.fs >= body * 1.3;
  let ressort = '';
  const unspace = t => /^(\S )+\S$/.test(t.trim()) ? t.replace(/ /g, '') : t;   // "E N T D E C K E N"
  for (const l of lines) if (l.y < headBand && l.fs > body * 1.5 && /\p{Lu}{3}/u.test(unspace(l.text)) && !/ZEIT/.test(l.text)) ressort = unspace(l.text).trim();
  const headTxt = lines.filter(l => l.y < headBand).map(l => l.text).join(' ');
  const adPage = /A\s?N\s?Z\s?E\s?I\s?G\s?E/.test(headTxt) && !/DIE ZEIT/.test(headTxt);
  const isLabel = l => { const t = unspace(l.text).trim(); return l.fs >= body * 1.9 && t.length > 2 && t === t.toUpperCase() && /\p{Lu}{3}/u.test(t) && t.split(/\s+/).length <= 3; };
  const isNum = l => !/\p{L}{2}/u.test(l.text);
  const heads = use.filter(l => big(l) && !isNum(l) && !(isLabel(l) && (ressort = ressort || unspace(l.text).trim()))).sort((a, b) => a.y - b.y);
  const groups = [];
  for (const l of heads) {
    let g = null;
    for (const G of groups) {
      const last = G.lines[G.lines.length - 1];
      const ov = Math.min(G.x1, l.x1) - Math.max(G.x, l.x);
      const gap = l.top - last.y;
      if (ov > Math.min(l.x1 - l.x, G.x1 - G.x) * 0.25 && gap < Math.max(l.fs, last.fs) * 1.6 && gap > -l.fs) { g = G; }
    }
    if (g) { g.lines.push(l); g.x = Math.min(g.x, l.x); g.x1 = Math.max(g.x1, l.x1); g.y1 = l.y; }
    else groups.push({ lines: [l], x: l.x, x1: l.x1, y0: l.top, y1: l.y });
  }
  // Zweizeiliger Titel, dessen zweite Zeile weiter unten steht (Bild dazwischen)
  for (let i = groups.length - 1; i > 0; i--) {
    const g = groups[i];
    const gfs = g.lines[0].fs;
    if (gfs < Math.max(...g.lines.map(l => l.fs))) continue;
    const up = groups.slice(0, i).reverse().find(G => Math.min(G.x1, g.x1) - Math.max(G.x, g.x) > 0);
    if (!up) continue;
    const ulast = up.lines[up.lines.length - 1];
    if (Math.abs(ulast.fs - gfs) > gfs * 0.05 || /[.!?«»“"]$/.test(ulast.text.trim())) continue;
    const sameAxis = Math.abs((ulast.x + ulast.x1) / 2 - (g.lines[0].x + g.lines[0].x1) / 2) < gfs * 0.6;
    const between = use.some(l => !big(l) && l.y > ulast.y && l.top < g.y0 && Math.min(l.x1, g.x1) - Math.max(l.x, g.x) > 0);
    if (between && !sameAxis) continue;
    up.lines.push(...g.lines); up.x = Math.min(up.x, g.x); up.x1 = Math.max(up.x1, g.x1); up.y1 = g.y1;
    groups.splice(i, 1);
  }
  // Titel = größte Schrift der Gruppe; darüber Dachzeile, darunter Vorspann
  const arts = [];
  for (const g of groups) {
    const max = Math.max(...g.lines.map(l => l.fs));
    if (max < body * 1.9) { g.weak = true; }
    const ti = g.lines.filter(l => l.fs >= max * 0.9);
    const firstT = g.lines.indexOf(ti[0]), lastT = g.lines.indexOf(ti[ti.length - 1]);
    g.title = joinLines(ti);
    g.kicker = joinLines(g.lines.slice(0, firstT));
    g.intro = joinLines(g.lines.slice(lastT + 1));
  }
  // Schwache Gruppen (nur Vorspann-Größe) an die Gruppe direkt darüber hängen, sonst eigene Artikel
  for (const g of groups) {
    if (!g.weak) { arts.push(g); continue; }
    const up = groups.filter(G => !G.weak && G.y1 < g.y0 && g.y0 - G.y1 < body * 6 && Math.min(G.x1, g.x1) - Math.max(G.x, g.x) > 0).pop();
    if (up && !up.intro) { up.intro = g.title + (g.intro ? ' ' + g.intro : ''); up.y1 = g.y1; up.x = Math.min(up.x, g.x); up.x1 = Math.max(up.x1, g.x1); }
    else arts.push(g);
  }

  // Hervorgehobenes Zitat im Text (»…«) ist kein Artikel
  const maxT = Math.max(0, ...arts.map(a => Math.max(...a.lines.map(l => l.fs))));
  for (let i = arts.length - 1; i >= 0; i--) {
    const g = arts[i], t = g.title;
    if (!g.intro && !g.kicker && /^[»«"„“]/.test(t) && /[«»"“”]$/.test(t) && Math.max(...g.lines.map(l => l.fs)) < maxT * 0.6) arts.splice(i, 1);
  }
  for (let i = arts.length - 1; i >= 0; i--) {
    const g = arts[i];
    if (g.intro || g.kicker) continue;
    const gmax = Math.max(...g.lines.map(l => l.fs));
    const par = arts.find(P => P !== g && P.y1 < g.y0 && P.x <= g.x + body && P.x1 >= g.x1 - body && Math.max(...P.lines.map(l => l.fs)) > gmax * 1.4);
    if (par) g.boxOf = par;   // Kasten im Artikel (z. B. Name unter dem Foto + Kurzporträt)
  }

  // 7) Textblöcke: Zeilen in Grundschrift-Nähe, die bündig untereinander stehen
  const txt = use.filter(l => !big(l)).sort((a, b) => a.x - b.x || a.y - b.y);
  const blocks = [];
  for (const l of txt.sort((a, b) => a.y - b.y)) {
    let B = null;
    for (const b of blocks) {
      const last = b.lines[b.lines.length - 1];
      const lh = Math.max(last.fs, l.fs) * 1.9;
      const sameCol = Math.abs(l.x - b.x) < l.fs * 2.2 || (l.x >= b.x - 2 && l.x1 <= b.x1 + l.fs * 1.5 && l.x < b.x + (b.x1 - b.x) * 0.5);
      const sizeOk = Math.abs(l.fs - last.fs) < body * 0.25 || (l.y - last.y < lh * 0.8 && Math.abs(l.fs - last.fs) < body * 0.4);
      if (sameCol && l.y - last.y > 0 && l.y - last.y < lh && sizeOk) { B = b; break; }
    }
    if (B) { B.lines.push(l); B.x = Math.min(B.x, l.x); B.x1 = Math.max(B.x1, l.x1); B.y1 = l.y; }

  }

    const fsAvg = b.lines.reduce((s, l) => s + l.fs, 0) / b.lines.length;

    const first = blocks.filter(b => b.y0 >= g.y1 - body && b.y0 < g.y1 + body * 3 && Math.min(b.x1, g.x1) - Math.max(b.x, g.x) > 0).sort((p, q) => p.y0 - q.y0)[0];
    if (!first) continue;

  }

  const orphan = { title: '', kicker: '', intro: '', x: 0, x1: W, y0: 0, y1: 0, orphan: true };
  for (const a of arts) a.blocks = [];
  orphan.blocks = [];
  blocks.sort((p, q) => p.y0 - q.y0);
  for (const b of blocks) {
    const mid = (b.x + b.x1) / 2;
    let best = arts.find(g => g.row && g.row.has(b)) || null;
    if (best) { best.blocks.push(b); b.art = best; continue; }
    // Block direkt darüber in derselben Spalte (Text fließt weiter)
    const pred = blocks.filter(q => q.art && q !== b && Math.abs(q.x - b.x) < body * 2 && q.y1 < b.y0 && b.y0 - q.y1 < H * 0.5 && !q.cap && !b.cap)
      .sort((p, q) => q.y1 - p.y1)[0];
    for (const a of arts) {
      if (a.boxOf || a.y1 > b.y0 + body) continue;
      const ov = Math.min(a.x1, b.x1) - Math.max(a.x, b.x);
      if (ov < (b.x1 - b.x) * 0.3 && !(mid > a.x - body && mid < a.x1 + body)) continue;
      if (!best || a.y1 > best.y1) best = a;
    }
    // Überschrift zwischen Vorgänger und Block? Sonst gehört der Block zum Artikel darüber
    if (pred && (!best || best.y1 <= pred.y1 + body)) { pred.art.blocks.push(b); b.art = pred.art; continue; }
    if (!best) {
      // Überschrift darüber, die nicht überlappt (ZEIT-Titel sind zentriert und schmaler als der Artikel)
      const above = arts.filter(a => !a.boxOf && a.y1 <= b.y0 + body);
      if (above.length) best = above.sort((p, q) => q.y1 - p.y1 || Math.abs((p.x + p.x1) / 2 - mid) - Math.abs((q.x + q.x1) / 2 - mid))[0];
    }
    if (!best) {
      // Spalte neben der Überschrift (Text beginnt links oben, Titel steht rechts daneben)
      const side = arts.filter(a => !a.boxOf && b.y0 >= a.y0 - H * 0.08 && b.y0 <= a.y1 + body * 4);
      if (side.length) best = side.sort((p, q) => Math.min(Math.abs(p.x - b.x1), Math.abs(b.x - p.x1)) - Math.min(Math.abs(q.x - b.x1), Math.abs(b.x - q.x1)))[0];
      else {
        // einzige Überschrift der Seite – wenn sie breit genug für einen Artikeltitel ist (schmale Namen = Anzeigen)
        const one = arts.filter(a => !a.weak && !a.boxOf);
        if (one.length === 1 && (one[0].x1 - one[0].x > W * 0.35 || Math.min(one[0].x1, b.x1) - Math.max(one[0].x, b.x) > 0)) best = one[0];
      }
    }
    (best || orphan).blocks.push(b); b.art = best || orphan;
  }
  if (orphan.blocks.length) arts.unshift(orphan);

  // 9) Reihenfolge im Artikel: Spalte für Spalte (links nach rechts), in der Spalte von oben nach unten
  const out = [];
  for (const a of arts) {
    const body_ = a.blocks.filter(b => !b.cap), caps = a.blocks.filter(b => b.cap);
    if (!body_.length && !a.title) continue;
    const colX = [];
    for (const b of [...body_].sort((p, q) => p.x - q.x)) {
      const c = colX.find(c => Math.abs(c - b.x) < body * 3);
      if (c == null) colX.push(b.x);
    }
    const colOf = b => colX.findIndex(c => Math.abs(c - b.x) < body * 3);
    body_.sort((p, q) => colOf(p) - colOf(q) || p.y0 - q.y0);
    const paras = [];
    for (const b of body_) addParas(paras, b, body);
    const words = body_.reduce((s, b) => s + b.words, 0);
    const fpc = {};
    for (const b of body_) for (const l of b.lines) for (const q of l.ps) if (q.fp) fpc[q.fp] = (fpc[q.fp] || 0) + q.s.length;
    const all = [...a.blocks, ...(a.lines || [])];
    const box = a.orphan ? [Math.min(...all.map(b => b.x)), Math.min(...all.map(b => b.y0)), Math.max(...all.map(b => b.x1)), Math.max(...all.map(b => b.y1))] : [Math.min(a.x, ...all.map(b => b.x)), Math.min(a.y0 ?? 1e9, ...all.map(b => b.y0 ?? b.top)), Math.max(a.x1, ...all.map(b => b.x1)), Math.max(a.y1, ...all.map(b => b.y1 ?? b.y))];
    out.push({
      title: a.title, kicker: a.kicker, intro: a.intro, orphan: !!a.orphan, words,
      paras, caps: caps.map(b => joinLines(b.lines)).filter(t => t.length > 15), boxOf: a.boxOf, src: a,
      fonts: Object.entries(fpc).sort((p, q) => q[1] - p[1]).slice(0, 4),
      box: box.map(Math.round),
      cols: body_.map(b => [Math.round(b.x), Math.round(b.y0), Math.round(b.x1), Math.round(b.y1 + 3)]),
    });
  }
  // Kästen an ihren Artikel hängen
  for (const o of out.filter(o => o.boxOf)) {
    const par = out.find(p => p.src === o.boxOf);
    if (par) { (par.boxes = par.boxes || []).push({ title: o.title, paras: [{ k: 'p', runs: [{ t: o.paras.map(p => p.runs.map(r => r.t).join('')).join(' ') }] }] }); par.words += o.words; }
    out.splice(out.indexOf(o), 1);
  }
  for (const o of out) {
    delete o.src; delete o.boxOf; o.ressort = ressort; o.by = ''; o.adPage = adPage;
    // Autorenzeile ("VON JULIANE SCHÄUBLE") vom Vorspann trennen
    for (const f of ['intro', 'title', 'kicker']) {
      const m = o[f].match(/\s*\b(?:VON|Von)\s+((?:[\p{Lu}][\p{Lu}'’.-]*(?:\s+|$)(?:UND\s+)?){1,6})$/u);
      if (m && m[1].trim().length > 3) {
        o.by = 'Von ' + m[1].trim().toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (x, a, b) => a + b.toUpperCase()).replace(/\bUnd\b/g, 'und');
        o[f] = o[f].slice(0, m.index).trim(); break;
      }
    }
  }
  // Kurze Reste (Kästen, Fotonachweise) nicht als eigene Artikel zeigen
  return out.filter(a => a.title ? (a.words > 25 || a.intro) : a.words > 60).sort((a, b) => (a.orphan ? -1 : 0) - (b.orphan ? -1 : 0) || a.box[1] - b.box[1] || a.box[0] - b.box[0]);
}

/* Zeilen zu Fließtext: Trennstriche am Zeilenende entfernen */
function joinLines(ls) {
  let s = '';
  for (const l of ls) s = joinText(s, l.text);
  return s.trim();
}
function joinText(s, t) {
  t = t.replace(/\s+/g, ' ').trim();
  if (!s) return t;
  if (/\p{L}[-‐­]$/u.test(s) && /^\p{Ll}/u.test(t)) return s.replace(/[-‐­]$/, '') + t;
  if (/[-‐]$/.test(s)) return s + t;   // "US-" + "Politik"
  return s + ' ' + t;
}
/* Absätze eines Blocks: Einzug oder kurze letzte Zeile = neuer Absatz; fette Zeile = Zwischenüberschrift */
function addParas(paras, b, body) {
  const minX = Math.min(...b.lines.map(l => l.x)), maxX = Math.max(...b.lines.map(l => l.x1));
  let cur = paras.length ? paras[paras.length - 1] : null;
  let prev = null;
  const L = b.lines;
  for (let li = 0; li < L.length; li++) {
    const l = L[li], nx = L[li + 1];
    // Einzug: gegenüber Zeile davor und danach um 0,6–2,5 Geviert nach rechts gerückt
    const di = r => r && l.x - r.x > body * 0.6 && l.x - r.x < body * 2.5;
    const indent = (prev ? di(prev) : true) && (nx ? di(nx) : !!prev) && !(prev && !nx && !di(prev));
    const centered = l.x - minX > body * 1.5 && maxX - l.x1 > body * 1.5;
    const sub = !l.byDrop && !l.drop && ((l.bold && l.text.length < 90) || (centered && l.text.length < 70 && !/[.,;]$/.test(l.text) && Math.abs((l.x - minX) - (maxX - l.x1)) < body * 2));
    // Kurze Zeile mit Satzende davor (Absatzende ohne Einzug, z. B. vor Interview-Fragen)
    const prevShort = prev && prev.x1 < Math.max(prev.x + (maxX - minX) * 0.7, maxX - (maxX - minX) * 0.3) && /[.!?:«»“”"')]$/.test(prev.text.trim()) && (!nx || Math.abs(l.x - nx.x) < body * 0.6 || di(nx));
    if (sub) {
      if (cur && cur.k === 'h' && prev && prev.bold === l.bold) cur.runs.push({ t: ' ' + l.text.trim() });
      else { cur = { k: 'h', runs: [{ t: l.text.trim() }] }; paras.push(cur); }
      prev = l; continue;
    }
    const speaker = l.runs.length > 1 && l.runs[0].b && !l.bold && /:\s*$/.test(l.runs[0].t);   // Interview: »ZEIT:«
    const newPara = speaker || !cur || cur.k === 'h' || indent || l.drop || (prev && prevShort) || (!prev && cur && /[.!?«"“]$/.test(lastText(cur)) && false);
    if (newPara) { cur = { k: 'p', runs: [] }; paras.push(cur); }
    for (const r of l.runs) {
      let t = r.t;
      if (!cur.runs.length) t = t.replace(/^\s+/, '');
      else if (r === l.runs[0]) {
        // Zeilenwechsel: Trennung auflösen
        const lr = cur.runs[cur.runs.length - 1];
        if (/\p{L}[-‐­]$/u.test(lr.t) && /^\p{Ll}/u.test(t.trim())) { lr.t = lr.t.replace(/[-‐­]$/, ''); t = t.trim(); }
        else if (/[-‐]$/.test(lr.t)) t = t.trim();
        else t = ' ' + t.trim();
      }
      const lr = cur.runs[cur.runs.length - 1];
      if (lr && !!lr.b === !!r.b && !!lr.i === !!r.i) lr.t += t;
      else cur.runs.push({ t, b: r.b, i: r.i });
    }
    prev = l;
  }
}
function lastText(p) { return p.runs.length ? p.runs[p.runs.length - 1].t.trim() : ''; }

   Sender aus dem freien Verzeichnis radio-browser.info, Favoriten, zuletzt gehört.
   Der laufende Titel (vom Sender mitgeschickt) liefert die Band für News und Infos. */
const RB_HOSTS=['de1.api.radio-browser.info','de2.api.radio-browser.info','fi1.api.radio-browser.info','nl1.api.radio-browser.info','at1.api.radio-browser.info'];
let rbHost=store.get('rbhost',RB_HOSTS[0]);
let rFav=store.get('rfav',[]),rRecent=store.get('rrecent',[]),rChip=store.get('rchip',null);
const rStations=new Map();
[...rFav,...rRecent].forEach(x=>rStations.set(x.id,x));
async function rb(path){
  for(const h of [rbHost,...RB_HOSTS.filter(x=>x!==rbHost)]){
    try{const r=await fetch('https://'+h+'/json/'+path,{headers:{'User-Agent':UA}});
      if(r.ok){if(h!==rbHost){rbHost=h;store.set('rbhost',h);}return r.json();}}catch(e){}
  }
  throw new Error('Radio-Verzeichnis nicht erreichbar');
}
const normSt=x=>({id:x.stationuuid,name:(x.name||'').trim(),url:x.url_resolved||x.url,logo:x.favicon||'',
  tags:(x.tags||'').split(',').map(t=>t.trim()).filter(Boolean).slice(0,3).join(', '),cc:x.countrycode||'',codec:x.codec||'',br:x.bitrate||0,hls:!!x.hls});
async function rbSearch(params){
  if(!NET)return demoStations(params);
  const q=new URLSearchParams({hidebroken:'true',order:'clickcount',reverse:'true',limit:'60',...params});
  const l=(await rb('stations/search?'+q)).map(normSt).filter(x=>x.url&&x.name);
  l.forEach(x=>rStations.set(x.id,x));return l;
}
const R_CHIPS=[['fav','♥ Meine'],['de','Beliebt',{countrycode:'DE'}],['rock','Rock',{tag:'rock',countrycode:'DE'}],['pop','Pop',{tag:'pop',countrycode:'DE'}],
  ['metal','Metal',{tag:'metal'}],['oldies','Oldies',{tag:'oldies',countrycode:'DE'}],['80s','80er',{tag:'80s'}],['jazz','Jazz',{tag:'jazz'}],
  ['klassik','Klassik',{tag:'classical',countrycode:'DE'}],['news','Nachrichten',{tag:'news',countrycode:'DE'}],['electro','Electro',{tag:'electronic'}],['schlager','Schlager',{tag:'schlager'}]];
if(!rChip)rChip=rFav.length?'fav':'de';

function curStation(){const id=String(S.id||'');return id.startsWith('r:')?rStations.get(id.slice(2))||null:null;}
async function playStation(st){
  rStations.set(st.id,st);
  rRecent=[st,...rRecent.filter(x=>x.id!==st.id)].slice(0,12);store.set('rrecent',rRecent);
  rLive='';rDeskT=0;

const isFav=id=>rFav.some(x=>x.id===id);
function toggleFav(st){if(isFav(st.id))rFav=rFav.filter(x=>x.id!==st.id);else rFav=[...rFav,st];store.set('rfav',rFav);toast(isFav(st.id)?'Zu „Meine Sender“ hinzugefügt':'Aus „Meine Sender“ entfernt');rRenderList();rRender();}

/* Laufender Titel: "Interpret - Titel" (Handy: vom Player, Linux: selbst aus dem Stream gelesen) */
let rLive='',rDeskT=0;
function liveText(){const st=curStation();if(!st)return '';
  if(DESKTOP)return rLive;
  if(!NET)return S.playing?'Die Gipfelstürmer - Morgenlicht':'';
  const m=(S.meta||'').trim();return m&&m!==st.name&&m!==S.station?m:'';}
function parseLive(t,st){
  if(!t||t.length>140||/https?:|www\.|werbung|^\s*-\s*$/i.test(t))return null;
  const i=t.indexOf(' - ');if(i<1)return{artist:'',title:t};
  const artist=t.slice(0,i).trim(),title=t.slice(i+3).trim();
  if(!artist||(st&&norm(artist)===norm(st.name)))return{artist:'',title:t};
  return{artist,title};
}
setInterval(async()=>{
  if(!DESKTOP)return;const st=curStation();

  rDeskT=Date.now();
  try{const t=await window.desktop.icy(st.url);if(curStation()===st&&t!==rLive){rLive=t;rRender();}}catch(e){}
},3000);

const dialPos=id=>8+(parseInt(hash(id||'x'),36)%840)/10;

window.rRender=rRender;
function stRow(x){
  return `<div class="res st" data-st="${esc(x.id)}"><div class="th rl"><svg class="i"><use href="#i-radio"/></svg>${x.logo?`<img src="${esc(x.logo)}" onerror="this.remove()" loading="lazy">`:''}</div>
    <div class="tx"><div class="n">${esc(x.name)}</div><div class="s">${esc([x.tags,x.cc,x.br?x.br+' kbit/s':''].filter(Boolean).join(' · '))}</div></div>
    <button class="add${isFav(x.id)?' on':''}" data-fav="${esc(x.id)}" aria-label="Favorit"><svg class="i"><use href="#i-heart"/></svg></button></div>`;

let rListData=[],rReq=0;
async function rLoad(){
  const box=$('#rList');const my=++rReq;
  const q=$('#rQ').value.trim();
  document.querySelectorAll('#rChips button').forEach(b=>b.classList.toggle('on',!q&&b.dataset.c===rChip));
  if(!q&&rChip==='fav'){rListData=null;rRenderList();return;}
  box.innerHTML='<div class="spin" style="margin:24px auto"></div>';

function rRenderList(){

    box.innerHTML=(rFav.length?`<div class="sec">Meine Sender</div>${rFav.map(stRow).join('')}`:`<div class="hint" style="padding:22px 10px">Noch keine Lieblingssender.<br>Tippe bei einem Sender auf ♥, dann landet er hier.</div>`)+
      (rRecent.some(x=>!isFav(x.id))?`<div class="sec">Zuletzt gehört</div>${rRecent.filter(x=>!isFav(x.id)).slice(0,8).map(stRow).join('')}`:'');
  }else box.innerHTML=rListData.length?rListData.map(stRow).join(''):'<div class="hint">Keine Sender gefunden.</div>';

function rInit(){
  $('#rChips').innerHTML=R_CHIPS.map(c=>`<button data-c="${c[0]}">${esc(c[1])}</button>`).join('');
  $('#rChips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;rChip=b.dataset.c;store.set('rchip',rChip);$('#rQ').value='';rLoad();};
  let t;$('#rQ').oninput=()=>{clearTimeout(t);t=setTimeout(rLoad,500);};
  $('#rList').onclick=e=>{
    const f=e.target.closest('[data-fav]');
    if(f){const x=rStations.get(f.dataset.fav);if(x)toggleFav(x);return;}

    else if(rRecent[0])playStation(rRecent[0]);
    else toast('Wähle unten einen Sender');};
  $('#rFav').onclick=()=>{const c=curStation();if(c)toggleFav(c);};
  $('#rBand').onclick=()=>{const b=$('#rBand').dataset.band;if(b)openBand(b);};
  $('#rFavBtn').onclick=()=>{rChip='fav';store.set('rchip',rChip);$('#rQ').value='';rLoad();};
  $('#rSearchBtn').onclick=()=>{$('#rQ').focus();};
  wireNewsCard('#rcard');
  rLoad();
}

/* ===================== PLATTENKISTE =====================
   Zufällige Alben mit Cover stehen in einer Holzkiste. Wischen blättert sie durch:
   die vordere Platte kippt nach vorne weg, die nächste steht frei. Mit Schwung und Einrasten. */
const crate={list:[],els:[],pos:0,vel:0,drag:null,raf:0,open:false,R:300,loadId:0};
const CRATE_N=36, STEP_PX=90;    // Fingerweg pro Platte
function crateSize(){const st=$('#cvStage');const R=Math.round(Math.min(window.innerWidth*0.8,(st?st.clientHeight:600)*0.55,400));crate.R=R;$('#crateOv').style.setProperty('--R',R+'px');}
/* Zufällige Alben suchen, die ein Cover haben */
async function crateFill(){
  const id=++crate.loadId;
  crate.list=[];crate.els=[];crate.pos=0;crate.vel=0;
  const box=$('#cvRecs');box.innerHTML='';
  const pool=albums.slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  $('#cvLoad').classList.toggle('hidden',false);
  let k=0;
  const work=async()=>{while(k<pool.length&&crate.list.length<CRATE_N){const a=pool[k++];
    const u=await art(a.id,500);if(id!==crate.loadId)return;
    if(u&&crate.list.length<CRATE_N){
      try{const im=new Image();im.src=u;await im.decode();}catch(e){}   // Bild vorab entpacken, sonst blitzt es beim ersten Zeigen
      if(id!==crate.loadId)return;
      if(crate.list.length<CRATE_N){crate.list.push({a,u});crateAdd(crate.list.length-1);}}}};
  await Promise.all([work(),work(),work(),work()]);
  if(id!==crate.loadId)return;
  $('#cvLoad').classList.add('hidden');
  if(!crate.list.length)$('#cvLoad').classList.remove('hidden'),$('#cvLoad').textContent='Keine Alben mit Cover gefunden.';
}
function crateAdd(i){
  const r=document.createElement('div');r.className='cv-rec';r.style.backgroundImage=`url("${crate.list[i].u}")`;r.innerHTML='<b></b><i></i>';
  r.style.visibility='hidden';$('#cvRecs').appendChild(r);crate.els[i]=r;
  if(i===0){$('#cvLoad').classList.add('hidden');crateInfo();}
  crateDraw();
}
/* Lage jeder Platte aus ihrem Abstand zur aktuellen Position */
function crateDraw(){
  const p=crate.pos,R=crate.R;
  for(let i=0;i<crate.els.length;i++){
    const el=crate.els[i];const d=i-p;
    if(d<-1.5||d>7.5){if(el.style.visibility!=='hidden')el.style.visibility='hidden';continue;}   // nur wenige Platten gleichzeitig zeichnen
    if(el.style.visibility==='hidden')el.style.visibility='';
    let tf,z,shade,op=1;
    if(d>=0){                                   // dahinter: kleiner, höher, dunkler – wie hintereinander stehende Hüllen
      const k=Math.min(d,6);
      tf=`translate(0,${(-k*R*0.075).toFixed(1)}px) scale(${(1-k*0.05).toFixed(4)})`;
      z=1000-Math.round(d*20);shade=Math.min(0.6,d*0.13);
      op=d<5.5?1:Math.max(0,1-(d-5.5)/2);
    }else{                                      // vorne weggeblättert: rutscht nach unten und verschwindet
      const t=Math.min(-d,1.5),e=Math.min(t,1);
      tf=`translate(0,${(t*R*0.95).toFixed(1)}px) scale(${(1+e*0.04).toFixed(4)}) rotate(${(e*-4).toFixed(2)}deg)`;
      z=1000+Math.round(e*20);shade=0;op=t<0.45?1:Math.max(0,1-(t-0.45)/0.45);
    }
    if(el._op!==op){el.style.opacity=op<1?op.toFixed(3):'';el._op=op;}
    el.style.transform=tf;el.style.zIndex=z;el.lastChild.style.opacity=shade.toFixed(3);
  }
}
let crateIdx=-1;
function crateInfo(){
  const i=Math.max(0,Math.min(crate.list.length-1,Math.round(crate.pos)));
  if(i===crateIdx||!crate.list[i])return;crateIdx=i;
  const a=crate.list[i].a;
  $('#cvT').textContent=a.name;$('#cvA').textContent=a.artist+(a.year?' · '+a.year:'');
  try{navigator.vibrate&&navigator.vibrate(3);}catch(e){}
}
/* Bewegung: Ziehen folgt dem Finger, danach Schwung mit Reibung, dann weich einrasten */
function crateLoop(){
  crate.raf=0;
  const n=crate.list.length;if(!n)return;
  if(!crate.drag){
    const target=Math.round(Math.max(0,Math.min(n-1,crate.pos+crate.vel*6)));
    if(Math.abs(crate.vel)>0.008){crate.pos+=crate.vel;crate.vel*=0.9;}
    else{crate.vel=0;const diff=target-crate.pos;crate.pos+=diff*0.09;if(Math.abs(diff)<0.002)crate.pos=target;}
    if(crate.pos<0){crate.pos+=(0-crate.pos)*0.25;crate.vel*=0.5;}
    if(crate.pos>n-1){crate.pos+=(n-1-crate.pos)*0.25;crate.vel*=0.5;}
  }
  crateDraw();crateInfo();
  const settled=!crate.drag&&crate.vel===0&&Math.abs(crate.pos-Math.round(crate.pos))<0.002;
  if(!settled)crate.raf=requestAnimationFrame(crateLoop);
}
const crateKick=()=>{if(!crate.raf)crate.raf=requestAnimationFrame(crateLoop);};
function crateOpen(){
  if(!albums.length){toast('Noch keine Musik eingelesen');return;}
  const ov=$('#crateOv');crate.open=true;crateIdx=-1;
  $('#cvT').textContent='';$('#cvA').textContent='';$('#cvLoad').textContent='Suche Platten…';
  ov.classList.add('show');crateSize();crateFill();pushNav('crate');
  clearTimeout(crate.hideT);crate.hideT=setTimeout(()=>{if(crate.open)$('#main').style.visibility='hidden';},450);
}
function crateClose(){$('#crateOv').classList.remove('show');crate.open=false;crate.loadId++;nav=nav.filter(x=>x!=='crate');clearTimeout(crate.hideT);$('#main').style.visibility='';}
/* Auflegen: Hülle kommt aus der Kiste, die Platte gleitet heraus und fliegt auf den Plattenspieler */
async function cratePlay(){
  const i=Math.round(crate.pos),c=crate.list[i];if(!c||crate.anim)return;
  crate.anim=true;crate.vel=0;
  art(c.a.id,700);                                  // großes Cover fürs Etikett schon mal laden
  const el=crate.els[i],r0=el.getBoundingClientRect(),S=crate.R;
  const fx=r0.left+(r0.width-S)/2,fy=r0.bottom-S;
  const fly=document.createElement('div');fly.className='flyer';
  fly.style.cssText=`left:${fx}px;top:${fy}px;width:${S}px;height:${S}px`;
  fly.innerHTML=`<div class="fl-disc"><div class="fl-lbl" style="background-image:url('${c.u}')"></div><i class="fl-hole"></i></div><div class="fl-sleeve" style="background-image:url('${c.u}')"></div>`;
  document.body.appendChild(fly);el.style.visibility='hidden';
  $('#crateOv').classList.add('picking');
  const ease='cubic-bezier(.3,.7,.2,1)',K=0.72,DX=-0.2*S,DY=-0.3*S;
  // 1. Hülle aus der Kiste ziehen (etwas kleiner und nach links, damit die Platte rechts Platz hat)
  await fly.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${DX}px,${DY}px) scale(${K})`}],{duration:600,easing:ease,fill:'forwards'}).finished;
  // 2. Platte gleitet seitlich aus der Hülle
  const disc=fly.querySelector('.fl-disc'),sl=fly.querySelector('.fl-sleeve');
  await disc.animate([{transform:'translateX(0) rotate(0deg)'},{transform:`translateX(${S*0.66}px) rotate(50deg)`}],{duration:800,easing:'cubic-bezier(.45,0,.25,1)',fill:'forwards'}).finished;
  // 3. Kiste und Hülle verschwinden, Platte fliegt auf den Teller
  crateClose();
  sl.animate([{transform:'translateY(0)',opacity:1},{transform:`translateY(${S*0.25}px)`,opacity:0}],{duration:350,easing:'ease-in',fill:'forwards'});
  const dk=$('#deck').getBoundingClientRect();
  const endRot=720+discAngle();                     // Platte landet genau in der Lage der Platte auf dem Teller
  const tw=dk.width*0.73,tcx=dk.left+dk.width*0.055+tw/2,tcy=dk.top+dk.height*0.125+tw/2;
  const fcx=fx+S/2+DX,fcy=fy+S/2+DY;                 // Mitte der (verschobenen, verkleinerten) Hülle
  const tx=(tcx-fcx)/K,ty=(tcy-fcy)/K,sc=tw/(S*0.96*K);
  await disc.animate([{transform:`translateX(${S*0.66}px) rotate(50deg) scale(1)`},
    {transform:`translate(${tx.toFixed(1)}px,${(ty-tw*0.1/K).toFixed(1)}px) rotate(${(endRot-60).toFixed(1)}deg) scale(${(sc*1.05).toFixed(3)})`,offset:0.82},
    {transform:`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) rotate(${endRot.toFixed(1)}deg) scale(${sc.toFixed(3)})`}],
    {duration:1050,easing:'cubic-bezier(.35,.1,.25,1)',fill:'forwards'}).finished;
  // 4. Landen: echtes Etikett vorher fertig laden, Platte darunter tauschen, dann die fliegende sanft ausblenden
  const big=await art(c.a.id,700);
  if(big){try{const im=new Image();im.src=big;await im.decode();}catch(e){}}
  deckInstant=true;swapping=true;                   // Teller dreht erst los, wenn die fliegende Platte weg ist
  setDeck(c.a.id);
  playList(c.a.tracks,0,false);
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  await fly.animate([{opacity:1},{opacity:0}],{duration:120,fill:'forwards'}).finished;
  fly.remove();$('#crateOv').classList.remove('picking');crate.anim=false;
  swapping=false;render();
}
(function crateWire(){
  const st=$('#cvStage');
  st.addEventListener('pointerdown',e=>{if(!crate.list.length||crate.anim)return;st.setPointerCapture(e.pointerId);
    crate.drag={x:e.clientX,y:e.clientY,p0:crate.pos,t0:performance.now(),lastY:e.clientY,lastX:e.clientX,lastT:performance.now(),moved:0};crate.vel=0;crateKick();});
  st.addEventListener('pointermove',e=>{const d=crate.drag;if(!d)return;
    const dx=e.clientX-d.x,dy=e.clientY-d.y;d.moved=Math.max(d.moved,Math.abs(dx)+Math.abs(dy));
    const delta=Math.abs(dy)>=Math.abs(dx)?dy:-dx;     // runter oder nach links wischen = weiterblättern
    const n=crate.list.length;let p=d.p0+delta/STEP_PX;
    if(p<0)p=p*0.35;if(p>n-1)p=n-1+(p-(n-1))*0.35;   // gummiartig am Rand
    const now=performance.now(),dt=Math.max(1,now-d.lastT);
    const step=(Math.abs(dy)>=Math.abs(dx)?(e.clientY-d.lastY):-(e.clientX-d.lastX))/STEP_PX;
    d.v=(d.v||0)*0.6+(step/dt*16.7)*0.4;d.lastY=e.clientY;d.lastX=e.clientX;d.lastT=now;
    crate.pos=p;crateKick();});
  const up=e=>{const d=crate.drag;if(!d)return;crate.drag=null;
    if(d.moved<8&&performance.now()-d.t0<350){       // Tippen auf die vordere Platte = auflegen
      cratePlay();}
    else crate.vel=Math.max(-0.28,Math.min(0.28,(d.v||0)*0.8));
    crateKick();};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  st.addEventListener('wheel',e=>{e.preventDefault();crate.vel=Math.max(-0.28,Math.min(0.28,crate.vel+e.deltaY/2600));crateKick();},{passive:false});
  document.addEventListener('keydown',e=>{if(!crate.open)return;
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.stopPropagation();crate.vel=0.16;crateKick();}
    if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.stopPropagation();crate.vel=-0.16;crateKick();}
    if(e.key==='Enter')cratePlay();},true);
  $('#cvClose').onclick=crateClose;
  $('#cvPlay').onclick=cratePlay;
  $('#cvShuffle').onclick=()=>{crateIdx=-1;$('#cvLoad').textContent='Suche Platten…';crateFill();};
  $('#btnCrate').onclick=crateOpen;
  window.addEventListener('resize',()=>{if(crate.open){crateSize();crateDraw();}});
})();
/* Kleine Kiste auf dem Plattenspieler-Reiter: drei Cover schauen heraus */
async function miniCrate(){
  const els=document.querySelectorAll('#btnCrate .mr');if(!albums.length)return;
  const pool=albums.slice().sort(()=>Math.random()-0.5);let k=0;
  for(const el of els){while(k<pool.length){const u=await art(pool[k++].id,150);if(u){el.style.backgroundImage=`url("${u}")`;break;}}}
}

/* Vorführmodus im Browser */
function demoFeed(u){
  const names={a:['Bergfunk','Gespräche über Gipfel, Touren und Hütten','Radio Werdenfels Demo'],b:['Zeitreise','Geschichte in 30 Minuten','Demo-Verlag'],c:['Technik am Abend','Gadgets, Apps und Kurioses','Studio Demo']};
  const k=(u.match(/demo-(\w)/)||[0,'a'])[1],n=names[k]||names.a;
  const col={a:'#3a6ea5',b:'#a5553a',c:'#5a3aa5'}[k]||'#555';
  const art='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="${col}"/><circle cx="220" cy="80" r="50" fill="#fff3"/><text x="20" y="250" font-family="sans-serif" font-size="38" font-weight="800" fill="#fff">${n[0]}</text></svg>`);
  let items='';const now=Date.now();
  for(let i=0;i<14;i++)items+=`<item><title>${n[0]} #${60-i}: ${['Der lange Weg','Hüttenzauber','Gewitter am Grat','Was wir lernten','Die große Frage','Unterwegs'][i%6]}</title><guid>${k}${i}</guid><pubDate>${new Date(now-i*4*864e5-36e5).toUTCString()}</pubDate><itunes:duration>${1800+i*137}</itunes:duration><enclosure url="https://example.org/${k}${i}.mp3" type="audio/mpeg"/><description>&lt;p&gt;In dieser Folge sprechen wir über ${n[1].toLowerCase()}.&lt;/p&gt;&lt;p&gt;Viel Spaß beim Hören!&lt;/p&gt;</description></item>`;
  return `<?xml version="1.0"?><rss xmlns:itunes="http://www.itunes.com/dtds/podcast-1.0.dtd"><channel><title>${n[0]}</title><itunes:author>${n[2]}</itunes:author><itunes:image href="${art.replace(/"/g,'&quot;')}"/><description>${n[1]}</description>${items}</channel></rss>`;
}
function demoItunes(){return Promise.resolve({results:[['Bergfunk','Radio Werdenfels Demo','a','Freizeit'],['Zeitreise','Demo-Verlag','b','Geschichte'],['Technik am Abend','Studio Demo','c','Technologie']].map(x=>({collectionName:x[0],artistName:x[1],feedUrl:'https://demo-'+x[2]+'.example/feed',artworkUrl600:'',primaryGenreName:x[3]}))});}

/* ===== Start ===== */
async function loadLibrary(manual){
  try{
    const r=await Music.scan();buildLibrary(r.tracks||[]);
    if(manual)toast(tracks.length+' Titel gefunden');
  }catch(e){toast(String(e&&e.message||e));}
  renderLib();render();miniCrate();
}
async function start(){
  Music.addListener('state',onState);
  let ok=false;try{ok=(await Music.status()).granted;}catch(e){}
  if(!ok){$('#welcome').classList.remove('hidden');$('#pick').classList.add('hidden');
    $('#btnGrant').onclick=async()=>{let g=false;try{g=(await Music.request()).granted;}catch(e){}
      if(g){$('#welcome').classList.add('hidden');$('#pick').classList.remove('hidden');await loadLibrary();}else toast('Ohne Freigabe findet die App keine Musik');};
    render();return;}
  await loadLibrary();
  try{const s=await Music.getState({queue:true});
    if(s.queue&&s.queue.length){queue=s.queue.map(Number);store.set('queue',queue);}
    onState(s);}catch(e){}
}
start();
